<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18283a" />
  <title>攻防 | MindsEvo 围棋</title>
  <link rel="stylesheet" href="../play/play.css" />
  <link rel="stylesheet" href="./basic-rules.css" />
  <link rel="stylesheet" href="./attack-defense.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-stone" aria-hidden="true"></span><span>围棋</span></a>
    <nav class="top-actions" aria-label="页面导航">
      <a href="./index.html">学习中心</a>
      <a href="../index.html">系统首页</a>
    </nav>
  </header>

  <main class="rules-shell attack-shell">
    <header class="rules-heading">
      <div>
        <p class="eyebrow">学习中心 · 首期</p>
        <h1>攻防</h1>
        <p>判断薄弱棋块的处境，练习紧气、逃跑、连接与取舍。</p>
      </div>
      <a class="back-link" href="./index.html">← 返回学习中心</a>
    </header>

    <div class="rules-layout attack-layout">
      <nav class="lesson-nav" aria-label="攻防小节">
        <p class="lesson-nav-title">课程目录</p>
        <button type="button" class="lesson-nav-item is-current" data-ad-lesson="attack"><span>01</span>攻击弱棋</button>
        <button type="button" class="lesson-nav-item" data-ad-lesson="escape"><span>02</span>逃跑延气</button>
        <button type="button" class="lesson-nav-item" data-ad-lesson="connect"><span>03</span>连接防守</button>
        <button type="button" class="lesson-nav-item" data-ad-lesson="seal"><span>04</span>封锁出口</button>
        <button type="button" class="lesson-nav-item" data-ad-lesson="sacrifice"><span>05</span>弃子取舍</button>
        <button type="button" class="lesson-nav-item" data-ad-lesson="review"><span>06</span>综合攻防</button>
      </nav>

      <section class="board-panel lesson-board-panel" aria-label="攻防练习棋盘">
        <div class="lesson-board-head">
          <div class="turn-indicator" aria-live="polite">
            <span class="turn-dot black-turn" id="adTurnDot" aria-hidden="true"></span>
            <div><strong id="adTurnText">黑方行棋</strong><span>9 路攻防练习</span></div>
          </div>
          <span class="lesson-counter" id="adCounter">01 / 06</span>
        </div>
        <div class="board-stage lesson-board-stage">
          <div class="go-board" id="adBoard" role="group" aria-label="攻防练习棋盘"></div>
        </div>
        <div class="lesson-board-controls" role="group" aria-label="攻防棋局操作">
          <span class="ad-state-label" id="adStateLabel">局部观察</span>
          <span class="lesson-captures"><span>黑提 <b id="adBlackCaptures">0</b></span><span>白提 <b id="adWhiteCaptures">0</b></span></span>
          <button type="button" class="tool-button icon-tool" id="adUndoButton" title="悔棋" aria-label="悔棋" disabled><span class="tool-icon" aria-hidden="true">↶</span></button>
          <button type="button" class="tool-button icon-tool" id="adResetButton" title="重置本节" aria-label="重置本节"><span class="tool-icon" aria-hidden="true">↻</span></button>
        </div>
        <p class="rule-note" id="adFeedback" role="status" aria-live="polite">黑方行棋：找出紧气的落点。</p>
      </section>

      <aside class="lesson-content" aria-label="本节学习内容">
        <div class="content-kicker">本节目标</div>
        <h2 id="adTitle">攻击弱棋</h2>
        <p class="lesson-intro" id="adIntro"></p>
        <div class="lesson-focus"><span>思维重点</span><strong id="adFocus"></strong></div>
        <section class="task-section">
          <h3>观察与练习</h3>
          <p id="adTask"></p>
          <div class="lesson-options" id="adOptions" role="group" aria-label="攻防判断选项"></div>
        </section>
        <div class="rule-explanation" id="adExplanation"></div>
        <div class="course-progress">
          <div class="progress-label"><span>课程进度</span><strong id="adProgress">第 1 节 / 共 6 节</strong></div>
          <div class="progress-track"><span id="adProgressFill"></span></div>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="./attack-defense.mjs"></script>
</body>
</html>
