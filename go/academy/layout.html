<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18283a" />
  <title>布局 | MindsEvo 围棋</title>
  <link rel="stylesheet" href="../play/play.css" />
  <link rel="stylesheet" href="./basic-rules.css" />
  <link rel="stylesheet" href="./layout.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-stone" aria-hidden="true"></span><span>围棋</span></a>
    <nav class="top-actions" aria-label="页面导航">
      <a href="./index.html">学习中心</a>
      <a href="../index.html">系统首页</a>
    </nav>
  </header>

  <main class="rules-shell layout-shell">
    <header class="rules-heading">
      <div>
        <p class="eyebrow">学习中心 · 首期</p>
        <h1>布局</h1>
        <p>从空角开始，观察棋子怎样向边线与全盘展开。</p>
      </div>
      <a class="back-link" href="./index.html">← 返回学习中心</a>
    </header>

    <div class="rules-layout layout-course-grid">
      <nav class="lesson-nav" aria-label="布局小节">
        <p class="lesson-nav-title">课程目录</p>
        <button type="button" class="lesson-nav-item is-current" data-layout-lesson="corner"><span>01</span>空角起手</button>
        <button type="button" class="lesson-nav-item" data-layout-lesson="four-corners"><span>02</span>四角展开</button>
        <button type="button" class="lesson-nav-item" data-layout-lesson="side"><span>03</span>角向边线</button>
        <button type="button" class="lesson-nav-item" data-layout-lesson="lines"><span>04</span>三线与四线</button>
        <button type="button" class="lesson-nav-item" data-layout-lesson="influence"><span>05</span>势力与实地</button>
        <button type="button" class="lesson-nav-item" data-layout-lesson="review"><span>06</span>全盘复盘</button>
      </nav>

      <section class="board-panel lesson-board-panel" aria-label="布局练习棋盘">
        <div class="lesson-board-head">
          <div class="turn-indicator" aria-live="polite">
            <span class="turn-dot black-turn" id="layoutTurnDot" aria-hidden="true"></span>
            <div><strong id="layoutTurnText">黑方行棋</strong><span>19 路全盘布局</span></div>
          </div>
          <span class="lesson-counter" id="layoutCounter">01 / 06</span>
        </div>
        <div class="board-stage lesson-board-stage">
          <div class="go-board" id="layoutBoard" role="group" aria-label="19 路布局练习棋盘"></div>
        </div>
        <div class="lesson-board-controls" role="group" aria-label="布局棋局操作">
          <span class="layout-state-label" id="layoutStateLabel">观察全盘</span>
          <span class="lesson-captures"><span>黑提 <b id="layoutBlackCaptures">0</b></span><span>白提 <b id="layoutWhiteCaptures">0</b></span></span>
          <button type="button" class="tool-button icon-tool" id="layoutUndoButton" title="悔棋" aria-label="悔棋" disabled><span class="tool-icon" aria-hidden="true">↶</span></button>
          <button type="button" class="tool-button icon-tool" id="layoutResetButton" title="重置本节" aria-label="重置本节"><span class="tool-icon" aria-hidden="true">↻</span></button>
        </div>
        <p class="rule-note" id="layoutFeedback" role="status" aria-live="polite">黑方行棋：先在空角建立落点。</p>
      </section>

      <aside class="lesson-content" aria-label="本节学习内容">
        <div class="content-kicker">本节目标</div>
        <h2 id="layoutTitle">空角起手</h2>
        <p class="lesson-intro" id="layoutIntro"></p>
        <div class="lesson-focus"><span>思维重点</span><strong id="layoutFocus"></strong></div>
        <section class="task-section">
          <h3>观察与练习</h3>
          <p id="layoutTask"></p>
          <div class="lesson-options" id="layoutOptions" role="group" aria-label="布局练习选项"></div>
        </section>
        <div class="rule-explanation" id="layoutExplanation"></div>
        <a class="layout-source" href="https://senseis.xmp.net/?BeginnersGuideToTheOpening" target="_blank" rel="noopener noreferrer">参考：Sensei's Library · Beginners Guide to the Opening</a>
        <div class="course-progress">
          <div class="progress-label"><span>课程进度</span><strong id="layoutProgress">第 1 节 / 共 6 节</strong></div>
          <div class="progress-track"><span id="layoutProgressFill"></span></div>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="./layout.mjs"></script>
</body>
</html>
