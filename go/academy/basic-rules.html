<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18283a" />
  <title>基础规则 | MindsEvo 围棋</title>
  <link rel="stylesheet" href="../play/play.css" />
  <link rel="stylesheet" href="./basic-rules.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-stone" aria-hidden="true"></span><span>围棋</span></a>
    <nav class="top-actions" aria-label="页面导航">
      <a href="./index.html">学习中心</a>
      <a href="../index.html">系统首页</a>
    </nav>
  </header>

  <main class="rules-shell">
    <header class="rules-heading">
      <div>
        <p class="eyebrow">学习中心 · 首期</p>
        <h1>基础规则</h1>
        <p>从交叉点开始，观察棋子怎样连接、获得气、被提走，并最终判断棋局结果。</p>
      </div>
      <a class="back-link" href="./index.html">← 返回学习中心</a>
    </header>

    <div class="rules-layout">
      <nav class="lesson-nav" aria-label="基础规则小节">
        <p class="lesson-nav-title">课程目录</p>
        <button type="button" class="lesson-nav-item is-current" data-lesson="board"><span>01</span>棋盘与落子</button>
        <button type="button" class="lesson-nav-item" data-lesson="liberties"><span>02</span>气与棋串</button>
        <button type="button" class="lesson-nav-item" data-lesson="capture"><span>03</span>提子</button>
        <button type="button" class="lesson-nav-item" data-lesson="suicide"><span>04</span>禁入点</button>
        <button type="button" class="lesson-nav-item" data-lesson="ko"><span>05</span>打劫</button>
        <button type="button" class="lesson-nav-item" data-lesson="pass"><span>06</span>停着与终局</button>
        <button type="button" class="lesson-nav-item" data-lesson="score"><span>07</span>数子与胜负</button>
        <button type="button" class="lesson-nav-item" data-lesson="practice"><span>08</span>综合练习</button>
      </nav>

      <section class="board-panel lesson-board-panel" aria-label="基础规则练习棋盘">
        <div class="lesson-board-head">
          <div class="turn-indicator" aria-live="polite">
            <span class="turn-dot black-turn" id="lessonTurnDot" aria-hidden="true"></span>
            <div><strong id="lessonTurnText">黑方行棋</strong><span id="lessonBoardHint">9 路练习棋盘</span></div>
          </div>
          <span class="lesson-counter" id="lessonCounter">01 / 08</span>
        </div>
        <div class="board-stage lesson-board-stage">
          <div class="go-board" id="lessonBoard" role="group" aria-label="基础规则练习棋盘"></div>
        </div>
        <div class="lesson-board-controls" role="group" aria-label="练习棋局操作">
          <button type="button" class="tool-button pass-tool" id="lessonPassButton"><span class="tool-icon" aria-hidden="true">Ⅱ</span><span>停着</span></button>
          <span class="lesson-captures"><span>黑提 <b id="lessonBlackCaptures">0</b></span><span>白提 <b id="lessonWhiteCaptures">0</b></span></span>
          <button type="button" class="tool-button icon-tool" id="lessonUndoButton" title="悔棋" aria-label="悔棋" disabled><span class="tool-icon" aria-hidden="true">↶</span></button>
          <button type="button" class="tool-button icon-tool" id="lessonResetButton" title="重置本节" aria-label="重置本节"><span class="tool-icon" aria-hidden="true">↻</span></button>
        </div>
        <p class="rule-note" id="lessonFeedback" role="status" aria-live="polite">选择一个交叉点试着落子。</p>
      </section>

      <aside class="lesson-content" aria-label="本节学习内容">
        <div class="content-kicker">本节目标</div>
        <h2 id="lessonTitle">棋盘与落子</h2>
        <p class="lesson-intro" id="lessonIntro"></p>
        <div class="lesson-focus">
          <span>思维重点</span>
          <strong id="lessonFocus"></strong>
        </div>
        <section class="task-section">
          <h3>观察与练习</h3>
          <p id="lessonTask"></p>
          <div class="lesson-options" id="lessonOptions" role="group" aria-label="本节练习选项"></div>
        </section>
        <div class="rule-explanation" id="ruleExplanation"></div>
        <section class="lesson-score-panel" id="lessonScorePanel" hidden aria-label="数子练习结果">
          <div class="score-panel-heading"><strong>中国数子</strong><span>白贴 7.5 目</span></div>
          <p id="scoringInstructions">双方连续停着后进入数子。</p>
          <div class="lesson-score-row"><span>黑方地盘</span><strong id="lessonBlackScore">0 目</strong></div>
          <div class="lesson-score-row"><span>白方地盘 + 贴目</span><strong id="lessonWhiteScore">0 + 7.5 = 7.5 目</strong></div>
          <div class="lesson-score-row"><span>中立点</span><strong id="lessonNeutralScore">0 目</strong></div>
          <p class="lesson-score-result" id="lessonScoreResult" role="status" aria-live="polite" hidden></p>
          <div class="lesson-score-actions">
            <button type="button" class="confirm-score-button" id="lessonConfirmScore">确认结果</button>
            <button type="button" id="lessonResume">恢复对弈</button>
          </div>
        </section>
        <div class="course-progress">
          <div class="progress-label"><span>课程进度</span><strong id="progressText">第 1 节 / 共 8 节</strong></div>
          <div class="progress-track"><span id="progressFill"></span></div>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="./basic-rules.mjs"></script>
</body>
</html>
