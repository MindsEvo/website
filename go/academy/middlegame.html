<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18283a" />
  <title>中盘 | MindsEvo 围棋</title>
  <link rel="stylesheet" href="../play/play.css" />
  <link rel="stylesheet" href="./basic-rules.css" />
  <link rel="stylesheet" href="./middlegame.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="../index.html"><span class="brand-stone" aria-hidden="true"></span><span>围棋</span></a>
    <nav class="top-actions" aria-label="页面导航">
      <a href="./index.html">学习中心</a>
      <a href="../index.html">系统首页</a>
    </nav>
  </header>

  <main class="rules-shell middlegame-shell">
    <header class="rules-heading">
      <div>
        <p class="eyebrow">学习中心 · 首期</p>
        <h1>中盘</h1>
        <p>从薄弱棋块与外势出发，练习攻守转换、侵消和全盘判断。</p>
      </div>
      <a class="back-link" href="./index.html">← 返回学习中心</a>
    </header>

    <div class="rules-layout middlegame-layout">
      <nav class="lesson-nav" aria-label="中盘小节">
        <p class="lesson-nav-title">课程目录</p>
        <button type="button" class="lesson-nav-item is-current" data-mid-lesson="weak"><span>01</span>发现弱棋</button>
        <button type="button" class="lesson-nav-item" data-mid-lesson="attack"><span>02</span>攻击与紧气</button>
        <button type="button" class="lesson-nav-item" data-mid-lesson="connect"><span>03</span>连接防守</button>
        <button type="button" class="lesson-nav-item" data-mid-lesson="invade"><span>04</span>侵消模样</button>
        <button type="button" class="lesson-nav-item" data-mid-lesson="attack-run"><span>05</span>攻击与逃跑</button>
        <button type="button" class="lesson-nav-item" data-mid-lesson="review"><span>06</span>全盘判断</button>
      </nav>

      <section class="board-panel lesson-board-panel" aria-label="中盘练习棋盘">
        <div class="lesson-board-head">
          <div class="turn-indicator" aria-live="polite">
            <span class="turn-dot black-turn" id="midTurnDot" aria-hidden="true"></span>
            <div><strong id="midTurnText">观察棋局</strong><span>19 路中盘练习</span></div>
          </div>
          <span class="lesson-counter" id="midCounter">01 / 06</span>
        </div>
        <div class="board-stage lesson-board-stage">
          <div class="go-board" id="midBoard" role="group" aria-label="19 路中盘练习棋盘"></div>
        </div>
        <div class="lesson-board-controls" role="group" aria-label="中盘棋局操作">
          <span class="mid-state-label" id="midStateLabel">全盘观察</span>
          <span class="lesson-captures"><span>黑提 <b id="midBlackCaptures">0</b></span><span>白提 <b id="midWhiteCaptures">0</b></span></span>
          <button type="button" class="tool-button icon-tool" id="midUndoButton" title="悔棋" aria-label="悔棋" disabled><span class="tool-icon" aria-hidden="true">↶</span></button>
          <button type="button" class="tool-button icon-tool" id="midResetButton" title="重置本节" aria-label="重置本节"><span class="tool-icon" aria-hidden="true">↻</span></button>
        </div>
        <p class="rule-note" id="midFeedback" role="status" aria-live="polite">点击白棋，查看它的棋串与共同气。</p>
      </section>

      <aside class="lesson-content" aria-label="本节学习内容">
        <div class="content-kicker">本节目标</div>
        <h2 id="midTitle">发现弱棋</h2>
        <p class="lesson-intro" id="midIntro"></p>
        <div class="lesson-focus"><span>思维重点</span><strong id="midFocus"></strong></div>
        <section class="task-section">
          <h3>观察与练习</h3>
          <p id="midTask"></p>
          <div class="lesson-options" id="midOptions" role="group" aria-label="中盘判断选项"></div>
        </section>
        <div class="rule-explanation" id="midExplanation"></div>
        <div class="course-progress">
          <div class="progress-label"><span>课程进度</span><strong id="midProgress">第 1 节 / 共 6 节</strong></div>
          <div class="progress-track"><span id="midProgressFill"></span></div>
        </div>
      </aside>
    </div>
  </main>
  <script type="module" src="./middlegame.mjs"></script>
</body>
</html>
