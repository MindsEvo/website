<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>残局入门 | 智慧元中心</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --line: #e8edf5;
      --ink: #1f2a3a;
      --muted: #6f7f94;
      --blue: #2d77e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      position: relative;
      min-height: 112px;
      margin-bottom: 12px;
    }

    .back-btn {
      position: absolute;
      left: 0;
      top: 4px;
      min-width: 120px;
      height: 34px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(45, 119, 232, 0.25);
    }

    .hero {
      text-align: center;
      padding-top: 0;
    }

    .hero h1 {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 34px;
      font-weight: 900;
      color: #202b3a;
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 26px;
      color: var(--muted);
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 124px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card-link:hover {
      border-color: #b9d2ff;
      box-shadow: 0 6px 20px rgba(45, 119, 232, 0.08);
    }

    .head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #1d2a3a;
      flex: 0 0 auto;
    }

    .i1 { background: #f1e8ff; }

    .title {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.1;
    }

    .t1 { color: #7f38cc; }

    .desc {
      font-size: 17px;
      color: #6f7f94;
      line-height: 1.38;
    }

    @media (max-width: 1280px) {
      .hero h1 { font-size: 30px; }
      .hero p { font-size: 22px; }
      .title { font-size: 22px; }
      .desc { font-size: 16px; }
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 28px; }
      .hero p { font-size: 19px; }
      .title { font-size: 21px; }
      .desc { font-size: 15px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="back-btn" href="../index.html" id="btnBackCenter">返回智慧元中心</a>
      <div class="hero">
        <h1><span>🎯</span><span>残局入门</span></h1>
        <p>探索残局的奇妙变化</p>
      </div>
    </header>

    <section class="grid">
      <a class="card card-link" href="./endgame-basics.html">
        <div class="head"><span class="icon i1">👀</span><h2 class="title t1">动态观察</h2></div>
        <p class="desc">从后对王的经典杀法开始，观看后与王如何配合将死对方</p>
      </a>
    </section>
  </main>

  <script>
    (function () {
      var btn = document.getElementById("btnBackCenter");
      if (!btn) return;
      btn.addEventListener("click", function (e) {
        if (window.history.length > 1) {
          e.preventDefault();
          window.history.back();
        }
      });
    }());
  </script>
</body>
</html>
