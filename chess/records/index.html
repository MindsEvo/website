<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的记录 | 国际象棋</title>
  <link rel="stylesheet" href="../analysis/style.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="records-page">
    <header class="records-header"><a class="back-link" href="../index.html">返回主页</a><h1>我的记录</h1></header>
    <div class="user-toolbar">
      <img id="userAvatar" class="avatar" alt="当前用户头像" src="../play/assets/pieces/wK.svg" />
      <label>当前用户<select id="userSelect"></select></label>
      <button type="button" id="manageUsers">用户管理</button>
    </div>
    <p id="pageStatus" role="status" aria-live="polite"></p>
    <div class="records-layout">
      <div class="records-main">
        <section class="record-section" aria-label="学习统计"><dl class="period-stats" id="periodStats"></dl></section>
        <section class="record-section"><h2>学习统计</h2><div class="table-scroll"><table><thead><tr><th scope="col">分类</th><th scope="col">L1级别</th><th scope="col">L2级别</th><th scope="col">L3级别</th><th scope="col">总计</th></tr></thead><tbody id="categoryStats"></tbody></table></div></section>
        <section class="record-section">
          <div class="section-heading"><h2>学习趋势</h2><label>周期<select id="trendPeriod"><option value="week">按周</option><option value="month">按月</option></select></label></div>
          <div id="trend" class="trend" role="img" aria-label="学习趋势"></div>
          <p id="trendStatus" class="empty-state"></p>
        </section>
        <section class="record-section"><h2>分类分布</h2><div id="categoryDistribution"></div></section>
      </div>
      <aside class="recommendations record-section">
        <h2>学习推荐</h2>
        <div class="segmented" role="group" aria-label="推荐模式">
          <button type="button" id="intelligentMode" aria-pressed="true">智能推荐</button>
          <button type="button" id="manualMode" aria-pressed="false">手动选择</button>
        </div>
        <div class="recommendation-actions"><button type="button" id="updateRecommendations">更新</button><button type="button" id="clearRecommendations">清空推荐</button></div>
        <p id="recommendationStatus" role="status" aria-live="polite"></p>
        <ol id="recommendationList" class="recommendation-list"></ol>
      </aside>
    </div>
  </main>
  <dialog id="usersDialog" aria-labelledby="usersTitle">
    <form id="usersForm"><div class="dialog-heading"><h2 id="usersTitle">用户管理</h2><button type="button" class="close-dialog" aria-label="关闭用户管理">×</button></div>
      <div id="userEditors"></div><p id="userError" role="alert"></p>
      <div class="dialog-actions"><button class="close-dialog" type="button">取消</button><button type="submit" class="primary">确定</button></div>
    </form>
  </dialog>
  <dialog id="recommendDialog" aria-labelledby="recommendTitle">
    <form id="recommendForm"><div class="dialog-heading"><h2 id="recommendTitle">智能推荐设置</h2><button type="button" class="close-dialog" aria-label="关闭推荐设置">×</button></div>
      <div class="recommend-filters" id="manualFilters">
        <label>题目类型<select id="recommendCategory"><option value="endgame">残局基因</option><option value="mate">攻杀基因</option><option value="tactics">战术基因</option><option value="opening">开局基因</option><option value="comprehensive">综合基因</option></select></label>
        <label>难度级别<select id="recommendDifficulty"><option>L1</option><option>L2</option><option>L3</option></select></label>
        <label>子分类<select id="recommendSubcategory"></select></label>
      </div>
      <label class="count-label">推荐数量<input id="recommendCount" type="number" min="1" max="30" step="1" value="3" required /></label>
      <p id="recommendError" role="alert"></p>
      <div class="dialog-actions"><button type="button" class="close-dialog">取消</button><button type="submit" class="primary">生成推荐</button></div>
    </form>
  </dialog>
  <script src="../play/assets/question-bank.js"></script>
  <script src="../play/bank-store.js"></script>
  <script src="./store.js"></script>
  <script src="./records.js"></script>
</body>
</html>
