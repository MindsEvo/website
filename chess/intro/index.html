<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../i18n.css" />
  <script src="../i18n.js"></script>
  <title>系统介绍 | 国际象棋</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f7; color: #202a35; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .page { width: min(100% - 32px, 980px); margin: 0 auto; padding: 28px 0 56px; }
    .back { display: inline-flex; align-items: center; min-height: 36px; color: #176b68; font-size: 14px; font-weight: 700; text-decoration: none; }
    .back:hover { text-decoration: underline; }
    header { padding: 34px 0 28px; border-bottom: 1px solid #cbd5d9; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(30px, 5vw, 46px); line-height: 1.15; }
    .lead { max-width: 720px; margin: 16px 0 0; color: #52616a; font-size: 18px; line-height: 1.65; }
    .content { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 36px; }
    section { padding: 26px 0; border-bottom: 1px solid #d5dde0; }
    section:first-child { grid-column: 1 / -1; }
    h2 { margin: 0 0 12px; color: #176b68; font-size: 20px; }
    p { margin: 0; color: #394750; font-size: 15px; line-height: 1.75; }
    @media (max-width: 620px) { .page { width: min(100% - 24px, 980px); padding-top: 16px; } header { padding-top: 25px; } .content { grid-template-columns: 1fr; } section:first-child { grid-column: auto; } }
  </style>
</head>
<body>
  <main class="page">
    <a class="back" href="../index.html">← 返回主页</a>
    <header>
      <h1>国际象棋智慧平台介绍</h1>
      <p class="lead">面向国际象棋学习与练习的独立平台</p>
    </header>
    <div class="content">
      <section>
        <h2>平台简介</h2>
        <p>从棋盘与棋子开始，逐步学习规则、战术、残局与开局原则。</p>
      </section>
      <section>
        <h2>学习路径</h2>
        <p>入门启航：认识棋盘、棋子走法，并通过经典棋局巩固基础。</p>
      </section>
      <section>
        <h2>智慧元中心</h2>
        <p>系统学习残局、战术、攻杀和开局原则。</p>
      </section>
      <section>
        <h2>对弈与复盘</h2>
        <p>进行人机对弈，查看对局记录，并使用题库分析与推荐工具。</p>
      </section>
      <section>
        <h2>独立的国际象棋学习空间</h2>
        <p>课程、对弈、记录、分析与设置均属于国际象棋模块。</p>
      </section>
    </div>
  </main>
</body>
</html>
