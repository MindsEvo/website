<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../i18n.css" />
  <script src="../i18n.js"></script>
  <title>根基因库生成 | 国际象棋</title>
  <link rel="stylesheet" href="./root-gene.css" />
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <div class="title-line"><span class="title-mark" aria-hidden="true">🧬</span><h1>根基因库生成</h1><span>棋局编辑与基因生成</span></div>
      <a class="back-link" href="./index.html">返回设置</a>
      <div class="header-state"><i></i><span id="pageStatus">系统就绪</span></div>
    </header>
    <section class="workbench" aria-label="根基因库生成工作台">
      <aside class="tool-panel">
        <h2 class="panel-title">🎛 控制面板</h2>
        <fieldset class="gene-group">
          <legend>根基因选择</legend>
          <label class="compact-field"><span>基因类型:</span><select id="geneType"><option value="endgame">残局基因</option><option value="tactics">战术基因</option><option value="mate">攻杀基因</option><option value="opening">开局基因</option><option value="comprehensive">综合基因</option></select></label>
          <label class="compact-field"><span>难度级别:</span><select id="geneLevel"><option value="L1">L1 基础</option><option value="L2">L2 组合</option><option value="L3">L3 复杂</option></select></label>
          <ul id="geneList" class="gene-list" aria-label="当前系列名称"></ul>
          <div class="gene-entry"><input id="geneName" autocomplete="off" placeholder="输入系列名称" aria-label="系列名称" /><button id="addGene" type="button">添加</button><button id="deleteGene" class="danger-button" type="button">删除</button></div>
          <p id="nameFormat" class="name-format">名称格式：eg_[棋子]-[对手]_L1-001</p>
        </fieldset>
        <fieldset class="pieces-group">
          <legend>棋子面板</legend>
          <div class="piece-color-switch" role="group" aria-label="选择棋子颜色">
            <button type="button" class="piece-color-button" data-piece-color="black" aria-pressed="false">黑方</button>
            <button type="button" class="piece-color-button active" data-piece-color="white" aria-pressed="true">白方</button>
          </div>
          <div id="piecePalette" class="piece-palette" aria-label="选择棋子"></div>
          <p class="piece-hint">← 点击棋子选中，再点棋盘格放置；再次点击同一棋子取消选中</p>
          <button id="eraseTool" class="erase-button" type="button" title="选择后点击棋盘移除棋子">⌫ 移除棋子</button>
        </fieldset>
        <fieldset class="actions-group">
          <legend>操作控制</legend>
          <div class="action-buttons"><button id="saveToBank" class="save-button" type="button">▣ 存储到题库</button><button id="clearResult" class="clear-button" type="button">▧ 清空结果</button><button id="firstMover" class="turn-button" type="button" aria-pressed="false">⚪ 先</button></div>
          <p id="bankFolderStatus" class="folder-status">正在连接固定目录 mindsevo/web/chess/academy…</p>
          <p id="targetDirectory" class="folder-status">保存位置：选择系列名称后自动确定</p>
        </fieldset>
        <p id="validationMessage" class="validation-message" role="status" aria-live="polite"></p>
      </aside>
      <section class="board-panel">
        <header class="board-panel-head"><h2>🎯 棋盘视图</h2><span id="pieceCount">0 / 32</span></header>
        <div class="board-wrap"><div class="board-shell"><div id="rankLabels" class="ranks rank-left" aria-hidden="true"></div><div id="chessboard" class="board" role="grid" aria-label="可编辑国际象棋棋盘"></div><div id="fileLabels" class="files file-bottom" aria-hidden="true"></div></div></div>
        <div class="board-caption"><span id="boardMessage">选择棋子，再点击棋盘格进行摆放。</span><span id="fenPreview" class="fen-preview"></span></div>
        <button id="flipBoard" class="flip-button" type="button" title="翻转棋盘方向">↕ 棋盘反转</button>
      </section>
      <aside class="library-panel">
        <h2 class="library-title">📚 题库目录</h2>
        <div id="bankTree" class="library-tree" role="tree" aria-label="题库目录"></div>
        <p id="libraryStatus" class="library-status" role="status"></p>
      </aside>
    </section>
  </main>
  <script src="../play/assets/question-bank.js"></script>
  <script src="./root-gene-core.js"></script>
  <script src="./root-gene-store.js"></script>
  <script src="./root-gene-page.js"></script>
</body>
</html>
