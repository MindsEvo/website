<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>接蛋数学 | Clio</title>
  <link rel="stylesheet" href="../_shared/clio-shell-bridge.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="clio-shell-wrap">

    <header class="clio-shell-topbar">
      <div>
        <h1 class="clio-shell-title" id="titleText">接蛋数学</h1>
        <p class="clio-shell-subtitle" id="subtitleText">移动鼠标控制小男孩，用头顶的竹筐接住蛋！</p>
      </div>
      <div class="clio-shell-tools">
        <button id="langBtn"  class="clio-shell-btn" type="button">中文 / EN</button>
        <button id="musicBtn" class="clio-shell-btn" type="button">音乐: 开</button>
        <button id="sfxBtn"   class="clio-shell-btn" type="button">音效: 开</button>
        <button id="voiceBtn" class="clio-shell-btn" type="button">语音: 开</button>
        <button id="resetBtn" class="clio-shell-btn" type="button">重置</button>
      </div>
    </header>

    <!-- HUD -->
    <div class="ec-hud">
      <div class="hud-chip"><span id="scoreLabel">得分</span>: <span id="scoreCount">0</span></div>
      <div class="hud-chip"><span id="bestLabel">最高</span>: <span id="bestScore">—</span></div>
    </div>

    <!-- ── Scene 1: Catch ─────────────────────────────────────────── -->
    <div id="sceneCatch" class="ec-stage">
      <div class="sky-bg" id="catchArea">
        <div class="sun">☀️</div>
        <div class="cloud c1">☁️</div>
        <div class="cloud c2">☁️</div>
        <div class="cloud c3">☁️</div>

        <div class="egg" id="eggEl">🥚</div>

        <div class="boy-wrap" id="boyEl">
          <div class="basket" id="basketEl">🧺</div>
          <div class="boy-body">🧒</div>
        </div>

        <div class="ground"></div>
        <p class="catch-hint" id="catchHint">🖱️ 移动鼠标接住蛋！</p>
      </div>
    </div>

    <!-- ── Scene 2: Math ─────────────────────────────────────────── -->
    <div id="sceneMath" class="ec-stage" hidden>
      <div class="math-bg">
        <div class="cracked-egg-anim">🥚💥</div>
        <div class="math-card clio-shell-card">
          <div class="q-equation" id="qEquation">3 + 4 = ?</div>
          <div class="opts-grid" id="optsGrid"></div>
          <p class="math-msg" id="mathMsg"></p>
        </div>
      </div>
    </div>

    <!-- ── Scene 3: Celebrate ────────────────────────────────────── -->
    <div id="sceneCelebrate" class="ec-stage" hidden>
      <div class="celebrate-bg">
        <div class="cele-emoji" id="celeEmoji">🎉</div>
        <h2 class="cele-title" id="celeTitle">太棒了！</h2>
        <p  class="cele-sub"   id="celeSub">继续接下一个蛋！</p>
        <div class="confetti-row" aria-hidden="true">
          <span>⭐</span><span>✨</span><span>🌟</span><span>⭐</span><span>✨</span>
        </div>
      </div>
    </div>

    <!-- ── Scene 4: Fail ─────────────────────────────────────────── -->
    <div id="sceneFail" class="ec-stage" hidden>
      <div class="fail-bg">
        <div class="fail-emoji" id="failEmoji">💀</div>
        <h2 class="fail-title" id="failTitle">答错了！</h2>
        <p  class="fail-sub"   id="failSub">游戏结束，再来一次！</p>
        <p  class="fail-score" id="failScore">得分：0</p>
        <button class="ec-btn-primary" id="retryBtn" type="button">重新来过 🥚</button>
      </div>
    </div>

  </main>
  <script src="../_shared/clio-runtime-bridge.js"></script>
  <script src="../_shared/clio-audio.js"></script>
  <script src="./data.js"></script>
  <script src="./game.js"></script>
</body>
</html>
