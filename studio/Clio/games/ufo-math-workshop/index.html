<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞盘登月 | Clio</title>
  <link rel="stylesheet" href="../_shared/clio-shell-bridge.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="clio-shell-wrap">

    <header class="clio-shell-topbar">
      <div>
        <h1 class="clio-shell-title" id="titleText">飞盘登月</h1>
        <p class="clio-shell-subtitle" id="subtitleText">点击飞盘，通过数学测试，带小伙伴登上月球！</p>
      </div>
      <div class="clio-shell-tools">
        <button id="langBtn"  class="clio-shell-btn" type="button">中文 / EN</button>
        <button id="musicBtn" class="clio-shell-btn" type="button">音乐: 开</button>
        <button id="sfxBtn"   class="clio-shell-btn" type="button">音效: 开</button>
        <button id="voiceBtn" class="clio-shell-btn" type="button">语音: 开</button>
        <button id="resetBtn" class="clio-shell-btn" type="button">重置</button>
      </div>
    </header>

    <!-- HUD -->
    <div class="ufo-hud">
      <div class="hud-chip"><span id="attemptLabel">次数</span>: <span id="attemptCount">0</span></div>
      <div class="hud-chip"><span id="bestLabel">最高分</span>: <span id="bestScore">—</span></div>
    </div>

    <!-- ── Scene 1: Sky / UFO ─────────────────────────────────────────── -->
    <div id="sceneSky" class="ufo-stage">
      <div class="sky-bg">
        <div class="stars-layer" id="starsLayer"></div>

        <div class="ufo-tap-area" id="ufoArea" role="button" tabindex="0" aria-label="飞盘">
          <div class="ufo-disc" id="ufoDisc">🛸</div>
          <div class="char-bubble" id="charBubble" hidden></div>
        </div>

        <p class="sky-hint" id="skyHint">✨ 点击飞盘，开启登月之旅！</p>
      </div>
    </div>

    <!-- ── Scene 2: Math test ─────────────────────────────────────────── -->
    <div id="sceneMath" class="ufo-stage" hidden>
      <div class="math-bg">
        <div class="math-toprow">
          <span class="math-char-badge" id="mathCharBadge">🐰</span>
          <div class="prog-strip" id="progStrip"></div>
          <span class="q-counter" id="qCounter">1 / 5</span>
        </div>

        <div class="math-card">
          <div class="q-equation" id="qEquation">3 + 4 = ?</div>
          <div class="opts-grid" id="optsGrid"></div>
        </div>

        <p class="math-msg" id="mathMsg"></p>
      </div>
    </div>

    <!-- ── Scene 3: Moon (success) ────────────────────────────────────── -->
    <div id="sceneMoon" class="ufo-stage" hidden>
      <div class="moon-bg">
        <div class="space-stars" id="moonStars"></div>
        <div class="earth-dot">🌍</div>

        <div class="moon-surface">
          <div class="moon-hill mh-l"></div>
          <div class="moon-hill mh-r"></div>
          <div class="moon-crater mc-1"></div>
          <div class="moon-crater mc-2"></div>
          <div class="moon-crater mc-3"></div>
          <div class="moon-items" id="moonItems"></div>
          <div class="moon-char"  id="moonChar">🐰</div>
        </div>

        <div class="moon-panel">
          <p class="moon-title" id="moonTitle">🎉 太棒了！成功登月！</p>
          <p class="moon-sub"   id="moonSub"></p>
          <button class="action-btn btn-primary" id="playAgainBtn" type="button">再玩一次 🚀</button>
        </div>
      </div>
    </div>

    <!-- ── Scene 4: Fail ──────────────────────────────────────────────── -->
    <div id="sceneFail" class="ufo-stage" hidden>
      <div class="fail-bg">
        <div class="fail-ufo">🛸</div>
        <div class="fail-char" id="failChar">🐰</div>
        <p class="fail-score" id="failScore">2 / 5</p>
        <p class="fail-sub"   id="failSub">再努力一次就能登月！</p>
        <button class="action-btn btn-retry" id="retryBtn" type="button">重新来过 🛸</button>
      </div>
    </div>

  </main>

  <script src="../../../../shell.js"></script>
  <script src="../_shared/clio-runtime-bridge.js"></script>
  <script src="../_shared/clio-audio.js"></script>
  <script src="./data.js"></script>
  <script src="./game.js"></script>
</body>
</html>
