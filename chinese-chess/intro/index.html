<body class="system-intro-page">
  <header class="topbar">
    <a class="brand" href="../index.html" aria-label="返回中国象棋首页">
      <img src="../../logo.png" alt="" />
      <span>中国象棋</span>
    </a>
    <nav class="top-actions" aria-label="主导航">
      <a class="nav-link" href="../index.html">系统首页</a>
      <a class="nav-link nav-link-muted" href="../academy/intro/index.html">学习中心</a>
    </nav>
  </header>

  <main class="system-intro-shell">
    <header class="system-intro-heading">
      <div>
        <p class="eyebrow"><span class="eyebrow-mark"></span> 象棋智能学习系统</p>
        <h1>系统介绍</h1>
        <p>从学习象棋到实战对弈，了解系统的主要功能和基本和棋规则。</p>
      </div>
      <a class="back-link" href="../index.html"><span aria-hidden="true">←</span> 返回系统首页</a>
    </header>

    <section class="intro-cards" aria-label="系统功能与规则">
      <article class="intro-card">
        <p class="card-kicker">学习</p>
        <h2>循序渐进学象棋</h2>
        <p>从认识棋子和走法开始，再练习开局、战术与残局。</p>
        <a class="card-link" href="../academy/intro/index.html">进入学习中心 <span aria-hidden="true">→</span></a>
      </article>

      <article class="intro-card">
        <p class="card-kicker">对弈</p>
        <h2>边下边练</h2>
        <p>支持双人对弈、人机对弈和 AI 对弈，并可回看棋谱。</p>
        <a class="card-link" href="../play/index.html">开始对弈 <span aria-hidden="true">→</span></a>
      </article>

      <article class="intro-card draw-card">
        <p class="card-kicker">和棋规则</p>
        <h2>哪些情况判和？</h2>
        <ul>
          <li>双方同意和棋。</li>
          <li>重复局面按循环着法判定；长将或长捉可能判负。</li>
          <li>连续 60 回合没有吃子，或双方仅剩将帅。</li>
        </ul>
        <p class="card-note">系统自动判定常见情况；复杂棋例仍以正式规则与裁判判断为准。</p>
      </article>
    </section>
  </main>
