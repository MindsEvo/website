<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f3f3" />
  <title>系统设置 | 象棋智能学习系统</title>
  <link rel="stylesheet" href="../chinese-chess.css" />
  <link rel="stylesheet" href="./settings.css" />
</head>
<body class="settings-page">
  <main class="settings-shell">
    <header class="settings-header">
      <a class="settings-back" href="../index.html">返回主页</a>
      <h1><span aria-hidden="true">⚙️</span> 系统设置</h1>
    </header>

    <section class="settings-grid" aria-label="设置分类">
      <article class="settings-card game-settings-card">
        <div class="settings-card-heading"><span class="settings-card-icon" aria-hidden="true">🎮</span><div><h2>游戏设置</h2><p>游戏体验配置</p></div></div>
        <p class="settings-card-description">游戏体验、时间控制、难度等设置</p>
        <span class="settings-tag tag-basic">基础</span>
      </article>
      <a class="settings-card engine-settings-card" href="../ai-engine/index.html" aria-label="打开AI引擎设置">
        <div class="settings-card-heading"><span class="settings-card-icon" aria-hidden="true">🤖</span><div><h2>AI引擎</h2><p>AI引擎管理</p></div></div>
        <p class="settings-card-description">引擎管理、性能配置、个性化设置</p>
        <span class="settings-tag tag-core">核心</span>
      </a>
      <article class="settings-card audio-settings-card">
        <div class="settings-card-heading"><span class="settings-card-icon" aria-hidden="true">♫</span><div><h2>语音音效</h2><p>声音配置</p></div></div>
        <p class="settings-card-description">音效设置、语音播报、TTS配置</p>
        <span class="settings-tag tag-experience">体验</span>
      </article>
      <article class="settings-card display-settings-card">
        <div class="settings-card-heading"><span class="settings-card-icon" aria-hidden="true">🎨</span><div><h2>显示界面</h2><p>界面主题</p></div></div>
        <p class="settings-card-description">主题外观、棋盘样式、界面布局</p>
        <span class="settings-tag tag-appearance">外观</span>
      </article>
      <article class="settings-card advanced-settings-card">
        <div class="settings-card-heading"><span class="settings-card-icon" aria-hidden="true">🔧</span><div><h2>高级设置</h2><p>系统配置</p></div></div>
        <p class="settings-card-description">系统设置、数据管理、网络配置</p>
        <span class="settings-tag tag-advanced">高级</span>
      </article>
      <a class="settings-card gene-settings-card" href="../rootgene/index.html" aria-label="打开根基因库管理系统">
        <div class="settings-card-heading"><span class="settings-card-icon" aria-hidden="true">🧬</span><div><h2>根基因库</h2><p>题目生成</p></div></div>
        <p class="settings-card-description">根基因库管理、题目生成、AI测试配置</p>
        <span class="settings-tag tag-pro">专业</span>
      </a>
    </section>

    <footer class="settings-footer">© 2025 CogniChess · 象棋智能学习系统</footer>
  </main>
</body>
</html>
