<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f4f5" />
  <title>根基因库管理系统 | CogniChess</title>
  <link rel="stylesheet" href="../chinese-chess.css" />
  <link rel="stylesheet" href="../board-standard.css" />
  <link rel="stylesheet" href="./rootgene.css" />
  <link rel="stylesheet" href="../shared/board-control-panel.css" />
</head>
<body class="rootgene-page">
  <main class="rootgene-app">
    <header class="rootgene-header">
      <div class="rootgene-brand"><span aria-hidden="true">🧬</span><h1>根基因库管理系统</h1><p>智能题目生成与AI测试平台</p></div>
      <div class="rootgene-header-actions">
        <a class="rootgene-back" href="../settings/index.html"><span aria-hidden="true">⇦</span> 返回设置</a>
        <span class="rootgene-status"><i aria-hidden="true"></i> 系统就绪</span>
      </div>
    </header>

    <div class="rootgene-workspace">
      <section class="rootgene-panel control-panel" aria-labelledby="controlTitle">
        <h2 class="panel-title" id="controlTitle"><span aria-hidden="true">🎛️</span> 控制面板</h2>

        <fieldset class="control-group gene-select-group">
          <legend>根基因选择</legend>
          <label class="select-line"><span>基因类型:</span><select id="geneType" aria-label="基因类型"><option value="endgame">残局基因</option></select></label>
          <label class="select-line"><span>难度级别:</span><select id="geneLevel" aria-label="难度级别"><option value="L1">L1 基础</option></select></label>
          <div class="gene-list-placeholder" id="geneList" aria-label="已保存的手工棋局"></div>
          <div class="gene-add-row"><input id="geneName" type="text" placeholder="编号格式：eg_CUSTOM_L1-001" aria-label="手工棋局编号" /><button id="geneNameCheck" type="button" class="small-add">检查</button><button id="geneDeleteButton" type="button" class="small-delete">删除</button></div>
        </fieldset>

        <fieldset class="control-group piece-config-group">
          <legend>棋子数量配置</legend>
          <div class="piece-config-row">
            <span class="side-swatch swatch-black" aria-label="黑方"></span>
            <button type="button" class="piece-palette-item" data-piece-code="r">车 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="h">马 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="c">炮 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="e">象 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="a">士 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="p">卒 <output>0</output></button>
          </div>
          <div class="piece-config-row">
            <span class="side-swatch swatch-red" aria-label="红方"></span>
            <button type="button" class="piece-palette-item" data-piece-code="R">车 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="H">马 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="C">炮 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="E">相 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="A">仕 <output>0</output></button>
            <button type="button" class="piece-palette-item" data-piece-code="P">兵 <output>0</output></button>
          </div>
          <div class="editor-tools"><button id="eraseTool" type="button" aria-pressed="false">橡皮擦</button><button id="firstMoverButton" type="button">先手：红方</button><span id="paletteStatus" role="status">选择棋子，再点击棋盘交叉点放置。</span></div>
        </fieldset>

        <fieldset class="control-group generation-group">
          <legend>生成参数</legend>
          <label class="parameter-row"><span>题目数量:</span><select aria-label="题目数量"><option>1 题</option></select></label>
          <label class="parameter-row"><span>难度系数:</span><input type="range" min="1" max="10" value="1" aria-label="难度系数" /><output>1 (最低)</output></label>
          <label class="parameter-row"><span>变化程度:</span><input type="range" min="1" max="10" value="1" aria-label="变化程度" /><output>1 (最低)</output></label>
          <label class="ai-check"><input type="checkbox" checked /> 启用AI验证</label>
        </fieldset>

        <fieldset class="control-group action-group">
          <legend>操作控制</legend>
          <div class="action-buttons">
            <button id="generatePositionButton" type="button" class="action-generate">🚀 生成局面</button>
            <button id="savePositionButton" type="button" class="action-save">▣ 存储到题库</button>
            <button id="testPositionButton" type="button" class="action-ai">🧪 AI测试</button>
            <button id="clearPositionButton" type="button" class="action-clear">▧ 清空结果</button>
            <button id="validatePositionButton" type="button" class="action-validate">🔍 验证局面</button>
          </div>
        </fieldset>
      </section>

      <section class="rootgene-panel board-panel" aria-labelledby="boardTitle">
        <h2 class="panel-title" id="boardTitle"><span aria-hidden="true">🎯</span> 棋盘视图</h2>
        <div class="gene-board-wrap">
          <div class="gene-board standard-board-surface">
            <div class="gene-board-engraving" aria-hidden="true">CogniChess 象棋教学系统</div>
            <div class="gene-river xiangqi-river-surface" aria-hidden="true"><strong>楚 河</strong><span>用象棋激发未来智慧</span><strong>汉 界</strong></div>
            <div class="gene-grid xiangqi-grid-area" id="geneBoard" role="grid" aria-label="手工编辑象棋局面"></div>
            <div class="gene-side-label" aria-hidden="true">红方走棋</div>
          </div>
        </div>
        <div class="gene-position-info"><strong>当前FEN:</strong><span id="currentFen">等待编辑...</span><span id="rootGeneStatus" role="status">点击棋子调色板后，在棋盘上摆放棋子。</span></div>
      </section>

      <aside class="rootgene-panel info-panel" aria-labelledby="infoTitle">
        <h2 class="panel-title" id="infoTitle"><span aria-hidden="true">📊</span> 信息面板</h2>
        <div class="info-tab">JSON</div>
        <label class="json-label" for="geneJson">题目JSON:</label>
        <textarea id="geneJson" readonly spellcheck="false" aria-label="题目JSON预览">{
  "geneId": "请选择基因",
  "displayInfo": {
    "chineseName": "等待生成..."
  },
  "metadata": {
    "difficulty": "L1",
    "sequence": 1,
    "verified": false
  }
}</textarea>
      </aside>
    </div>

    <footer class="rootgene-footer"><span>根基因库管理系统 v1.0 | 中国象棋手工局面编辑</span><button id="rootGeneFooterSave" type="button">▣ 保存</button></footer>
  </main>
  <script type="module" src="./rootgene-page.mjs"></script>
  <script type="module" src="../shared/board-control-panel-boot.mjs"></script>
</body>
</html>
