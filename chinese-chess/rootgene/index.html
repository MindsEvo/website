<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f4f5" />
  <title>根基因库管理系统 | CogniChess</title>
  <link rel="stylesheet" href="../chinese-chess.css" />
  <link rel="stylesheet" href="../board-standard.css" />
  <link rel="stylesheet" href="./rootgene.css" />
  <link rel="stylesheet" href="../shared/board-control-panel.css" />
</head>
<body class="rootgene-page">
  <main class="rootgene-app">
    <header class="rootgene-header">
      <div class="rootgene-brand"><span aria-hidden="true">🧬</span><h1>根基因库管理系统</h1><p>局面编辑与题库管理</p></div>
      <div class="rootgene-header-actions">
        <a class="rootgene-back" href="../settings/index.html"><span aria-hidden="true">⇦</span> 返回设置</a>
        <span class="rootgene-status"><i aria-hidden="true"></i> 系统就绪</span>
      </div>
    </header>

    <div class="rootgene-workspace">
      <div class="rootgene-sidebar">
      <section class="rootgene-panel control-panel" aria-labelledby="controlTitle">
        <h2 class="panel-title" id="controlTitle"><span aria-hidden="true">🎛️</span> 控制面板</h2>

        <fieldset class="control-group gene-select-group">
          <legend>根基因选择</legend>
          <label class="select-line"><span>基因类型:</span><select id="geneType" aria-label="基因类型"><option value="endgame">残局基础</option><option value="attacking">基本攻杀</option><option value="tactics">基本战术</option></select></label>
          <label class="select-line"><span>难度级别:</span><select id="geneLevel" aria-label="难度级别"><option value="L1">L1 基础</option><option value="L2">L2 进阶</option><option value="L3">L3 高阶</option></select></label>
          <div class="gene-list-placeholder" id="geneList" aria-label="已保存的手工棋局"></div>
          <div class="gene-add-row"><input id="geneName" type="text" placeholder="编号格式：eg_CUSTOM_L1-001" aria-label="手工棋局编号" /><button id="geneNameCheck" type="button" class="small-add">检查</button><button id="geneDeleteButton" type="button" class="small-delete">删除</button></div>
          <p id="nameFormat" class="name-format"></p>
        </fieldset>

        <fieldset class="control-group piece-config-group">
          <legend>棋子面板</legend>
          <div class="palette-sides" role="group" aria-label="棋子颜色">
            <button type="button" data-palette-side="red" aria-pressed="true">红方</button>
            <button type="button" data-palette-side="black" aria-pressed="false">黑方</button>
          </div>
          <div class="piece-config-row" id="piecePalette">
            <button type="button" class="piece-palette-item" data-piece-type="K"></button>
            <button type="button" class="piece-palette-item" data-piece-type="R"></button>
            <button type="button" class="piece-palette-item" data-piece-type="H"></button>
            <button type="button" class="piece-palette-item" data-piece-type="C"></button>
            <button type="button" class="piece-palette-item" data-piece-type="E"></button>
            <button type="button" class="piece-palette-item" data-piece-type="A"></button>
            <button type="button" class="piece-palette-item" data-piece-type="P"></button>
          </div>
          <p class="palette-help">点击棋盘棋子选中，再点击目标位置摆放；再次点击原位置取消。也可从面板添加棋子。重置恢复载入局面，将帅每方保留一枚。</p>
          <div class="editor-tools"><button id="eraseTool" type="button" aria-pressed="false">橡皮擦</button><button id="firstMoverButton" type="button">先手：红方</button><span id="paletteStatus" role="status">选择棋子，再点击棋盘交叉点放置。</span></div>
        </fieldset>

        <fieldset class="control-group action-group">
          <legend>操作控制</legend>
          <div class="action-buttons">
            <button id="generatePositionButton" type="button" class="action-generate">🚀 生成局面</button>
            <button id="savePositionButton" type="button" class="action-save">▣ 存储到题库</button>
            <button id="clearPositionButton" type="button" class="action-clear">▧ 清空结果</button>
          </div>
        </fieldset>
      </section>
      </div>

      <section class="rootgene-panel board-panel" aria-labelledby="boardTitle">
        <h2 class="panel-title" id="boardTitle"><span aria-hidden="true">🎯</span> 棋盘视图</h2>
        <div class="gene-board-wrap">
          <div class="gene-board standard-board-surface">
            <div class="gene-board-engraving" aria-hidden="true">CogniChess 象棋教学系统</div>
            <div class="gene-river xiangqi-river-surface" aria-hidden="true"><strong>楚 河</strong><span>用象棋激发未来智慧</span><strong>汉 界</strong></div>
            <div class="gene-grid xiangqi-grid-area" id="geneBoard" role="grid" aria-label="手工编辑象棋局面"></div>
            <div class="gene-side-label" aria-hidden="true">红方走棋</div>
          </div>
        </div>
        <nav id="geneBoardToolbar" aria-label="棋盘通用控制面板"></nav>
      </section>

      <section class="rootgene-panel material-panel" aria-label="棋谱与解说编辑">
        <h2 class="panel-title">棋谱与解说编辑</h2>
        <div class="material-actions">
          <button id="loadSolutionButton" type="button">答案</button>
          <button id="recordButton" type="button">开始记录</button>
          <button id="saveSolutionButton" type="button">保存棋谱</button>
        </div>
        <label for="solutionVariant">题库答案</label>
        <select id="solutionVariant" aria-label="选择答案版本"><option value="">暂无答案</option></select>
        <textarea id="solutionText" spellcheck="false" aria-label="棋谱答案" placeholder="载入答案，或开始记录后走棋；AI-AI 点击播放求解。"></textarea>
        <div class="material-version"><label for="solutionVersion">答案版本</label><input id="solutionVersion" type="number" min="1" max="999" value="1" /></div>
        <p id="solutionStatus" role="status">先保存手工局面，再记录和保存配套棋谱。</p>
        <div class="material-actions">
          <button id="loadExplanationButton" type="button">解说</button>
          <button id="saveExplanationButton" type="button">保存解说</button>
        </div>
        <label for="explanationText">解说内容</label>
        <textarea id="explanationText" spellcheck="false" aria-label="解说内容" placeholder="在此编辑配套解说。"></textarea>
        <div class="material-version"><label for="explanationVersion">解说版本</label><input id="explanationVersion" type="number" min="1" max="999" value="1" /></div>
        <p id="explanationStatus" role="status">导入棋局只读；另存为手工棋局后可保存材料。</p>
        <input id="solutionFileInput" type="file" accept=".txt,text/plain" hidden />
        <input id="explanationFileInput" type="file" accept=".txt,text/plain" hidden />
      </section>
      <aside class="rootgene-panel bank-panel" aria-labelledby="bankTitle">
        <h2 class="panel-title" id="bankTitle"><span aria-hidden="true">📚</span> 题库目录</h2>
        <input id="bankSearch" type="search" placeholder="搜索名称或编号" aria-label="搜索题库" />
        <div id="bankTree" class="bank-tree" aria-label="题库目录"></div>
        <p id="bankSummary" role="status">正在载入题库…</p>
      </aside>
    </div>

    <footer class="rootgene-footer"><span id="rootGeneStatus" role="status">点击棋子后选择摆放位置。</span><button id="rootGeneFooterSave" type="button">▣ 保存</button></footer>
  </main>
  <script type="module" src="./rootgene-page.mjs"></script>
</body>
</html>
