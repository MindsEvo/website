<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>Pattern generator audit</title>
<style>body{font:14px system-ui;padding:20px;background:#fffbeb}.ok{color:#16a34a}.bad{color:#dc2626}pre{background:#fff;padding:8px;border-radius:8px}</style></head>
<body><h2>规律 · 生成器审计 (Pattern generator audit)</h2><div id="out"></div>
<script src="./generator.js"></script>
<script>
(function () {
  var CAP = { K1: 5, K2: 10, G1: 20, G2: 100 }, N = 300, out = document.getElementById('out'), total = 0;
  function line(cls, t) { out.insertAdjacentHTML('beforeend', '<div class="' + cls + '">' + t + '</div>'); }
  ['K1', 'K2', 'G1', 'G2'].forEach(function (g) {
    var bad = [], mix = {};
    PT_GEN.GRADE_UNITS[g].forEach(function (u) { for (var r = 0; r < N; r++) PT_GEN.generate(g, 8, u.key).forEach(function (q) {
      total++; mix[q.structure + '/' + q.task] = (mix[q.structure + '/' + q.task] || 0) + 1;
      var why = null, opts = (q.options || []).map(String);
      if (opts.length < 3 || new Set(opts).size !== opts.length) why = 'options';
      else if (q.task !== 'discover' && opts.indexOf(String(q.answer)) < 0) why = 'answer not in options';
      else if (q.task === 'repair' && String(q.seq[q.brokenIndex]) === String(q.answer)) why = 'repair: broken item equals answer';
      else if (q.task === 'discover' && (q.groups.length !== 4 || new Set(q.groups.map(function (x) { return x.seq.join(); })).size !== 4)) why = 'discover groups';
      else if (q.task !== 'discover' && q.task !== 'repair' && !q.rows && q.seq.indexOf('?') < 0) why = 'no blank';
      else if ((q.seq || []).concat(q.options).some(function (x) { return typeof x === 'number' && (x < 0 || x > CAP[g]); })) why = 'out of range';
      if (why && bad.length < 3) bad.push(why + ' ' + JSON.stringify(q));
      else if (why) bad.push(why);
    }); });
    line(bad.length ? 'bad' : 'ok', g + ': ' + (bad.length ? 'FAIL ' + bad.length : 'PASS') + ' (' + N * 8 + ' items)');
    if (bad.length) out.insertAdjacentHTML('beforeend', '<pre>' + bad.slice(0, 3).join('\n') + '</pre>');
    line('', '&nbsp;&nbsp;mix: ' + Object.keys(mix).sort().map(function (k) { return k + '×' + mix[k]; }).join(' · '));
  });
})();
</script></body></html>
