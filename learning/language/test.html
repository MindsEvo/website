<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Language & Literacy content audit</title>
<style>
body{font:14px system-ui;padding:20px;background:#fffbeb;color:#1e293b}
h2{margin-bottom:6px}.summary{color:#64748b;margin-bottom:18px}
.section{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0}
.ok{color:#15803d;font-weight:800}.bad{color:#dc2626;font-weight:800}
.detail{white-space:pre-wrap;background:#f8fafc;border-radius:8px;padding:8px;margin-top:6px;color:#475569}
.review{background:#fff7ed;border:2px solid #f59e0b;border-radius:12px;padding:14px;margin-top:18px}
.review h3{color:#b45309;margin:0 0 8px}.review li{margin:5px 0}
</style>
</head>
<body>
<h2>语文素养 · 内容与生成器审计</h2>
<div class="summary" id="summary"></div>
<div id="out"></div>
<div class="review">
  <h3>REVIEW REQUIRED · 必须人工审稿</h3>
  <ul>
    <li>不读文本、不听叙述或不看画面时，客观题是否确实无法作答。</li>
    <li>中文与 English 是否分别原生设计，而不是翻译、镜像或只替换角色。</li>
    <li>素材来源与版权标注是否适宜，现代受保护文本是否只作难度和体裁参照。</li>
    <li>真实语言质量、年级适宜性、生字率、Lexile / F&amp;P 与认知难度是否合理。</li>
    <li>干扰项是否对应有教学价值的典型误解，而不只是显然错误的答案。</li>
    <li>Express / Create 的 Reference Ideas 是否丰富、自然，并真正促进比较与反思。</li>
  </ul>
</div>

<script src="./data.js"></script>
<script src="./generator.js"></script>
<script>
(function () {
  'use strict';

  var out = document.getElementById('out');
  var summary = document.getElementById('summary');
  var VALID_LANGS = ['zh', 'en'];
  var VALID_GRADES = ['K1', 'K2', 'G1', 'G2'];
  var VALID_UNITS = ['observe', 'comprehend', 'infer', 'structure', 'choose', 'express', 'create'];
  var VALID_LEVELS = ['L1', 'L2', 'L3', 'L4'];
  var passed = 0;
  var failed = 0;

  function unique(values) {
    return values.filter(function (value, index) {
      return values.indexOf(value) === index;
    });
  }

  function sameArray(a, b) {
    return a.length === b.length && a.every(function (value, index) {
      return value === b[index];
    });
  }

  function sameSet(a, b) {
    var left = (a || []).slice().sort();
    var right = (b || []).slice().sort();
    return sameArray(left, right);
  }

  function requireValue(condition, message, errors) {
    if (!condition) { errors.push(message); }
  }

  function renderCheck(name, fn) {
    var errors = [];
    try {
      fn(errors);
    } catch (error) {
      errors.push(error && error.stack ? error.stack : String(error));
    }

    var box = document.createElement('div');
    box.className = 'section';
    if (errors.length) {
      failed++;
      box.innerHTML = '<div class="bad">FAIL · ' + name + ' (' + errors.length + ')</div>' +
        '<div class="detail">' + errors.slice(0, 5).join('\n') +
        (errors.length > 5 ? '\n… 另有 ' + (errors.length - 5) + ' 项' : '') + '</div>';
    } else {
      passed++;
      box.innerHTML = '<div class="ok">PASS · ' + name + '</div>';
    }
    out.appendChild(box);
  }

  function auditCcr(entry, label, ccr, errors) {
    if (!ccr) { return; }
    var prompt = ccr.prompt || ccr.promptZh || ccr.promptEn;
    var reflectPrompt = ccr.reflectPrompt || ccr.reflectPromptZh || ccr.reflectPromptEn;
    requireValue(!!prompt, label + ': CCR 缺少 prompt', errors);
    requireValue(typeof ccr.template === 'string' && ccr.template.length > 0,
      label + ': CCR 缺少 template', errors);
    requireValue(Array.isArray(ccr.slots) && ccr.slots.length > 0,
      label + ': CCR slots 为空', errors);
    requireValue(Array.isArray(ccr.otherIdeas) && ccr.otherIdeas.length > 0,
      label + ': CCR otherIdeas 为空', errors);
    requireValue(!!reflectPrompt, label + ': CCR 缺少 reflectPrompt', errors);

    (ccr.slots || []).forEach(function (slot) {
      var name = slot.name || slot.nameZh || slot.nameEn;
      var options = slot.options || slot.optionsZh || slot.optionsEn;
      requireValue(!!slot.key, label + ': CCR slot 缺少 key', errors);
      requireValue(!!name, label + ': CCR slot ' + (slot.key || '?') + ' 缺少 name', errors);
      requireValue(Array.isArray(options) && options.length > 0,
        label + ': CCR slot ' + (slot.key || '?') + ' options 为空', errors);
      if (slot.key && ccr.template) {
        requireValue(ccr.template.indexOf('{' + slot.key + '}') >= 0,
          label + ': template 未引用 {' + slot.key + '}', errors);
      }
    });

    (ccr.otherIdeas || []).forEach(function (idea, index) {
      requireValue(!!(idea.viewpoint || idea.viewpointZh || idea.viewpointEn),
        label + ': otherIdeas[' + index + '] 缺少 viewpoint', errors);
      requireValue(!!(idea.text || idea.textZh || idea.textEn),
        label + ': otherIdeas[' + index + '] 缺少 text', errors);
    });
  }

  renderCheck('全局 material ID 唯一', function (errors) {
    var ids = LANG_DATA.PASSAGES.concat(LANG_DATA.SCENES).map(function (entry) { return entry.id; });
    requireValue(unique(ids).length === ids.length, 'PASSAGES / SCENES 存在重复 ID', errors);
  });

  renderCheck('素材基础结构与内部 ID', function (errors) {
    LANG_DATA.PASSAGES.forEach(function (passage) {
      var label = 'PASSAGE ' + passage.id;
      requireValue(!!passage.id && !!passage.title && !!passage.genre, label + ': 缺少 id/title/genre', errors);
      requireValue(VALID_LANGS.indexOf(passage.lang) >= 0, label + ': 非法 lang', errors);
      requireValue(['G1', 'G2'].indexOf(passage.grade) >= 0, label + ': 非法 grade', errors);
      requireValue(passage.anchors && Array.isArray(passage.anchors.curriculum) &&
        passage.anchors.curriculum.length > 0, label + ': 缺少 curriculum anchors', errors);
      requireValue(Array.isArray(passage.sentences) && passage.sentences.length > 0,
        label + ': sentences 为空', errors);
      requireValue(Array.isArray(passage.items) && passage.items.length > 0,
        label + ': items 为空', errors);

      var sentenceIds = (passage.sentences || []).map(function (sentence) { return sentence.id; });
      var itemIds = (passage.items || []).map(function (item) { return item.id; });
      requireValue(unique(sentenceIds).length === sentenceIds.length, label + ': sentence ID 重复', errors);
      requireValue(unique(itemIds).length === itemIds.length, label + ': item ID 重复', errors);
      (passage.sentences || []).forEach(function (sentence) {
        requireValue(!!sentence.id && !!sentence.text, label + ': sentence 缺少 id/text', errors);
      });
    });

    LANG_DATA.SCENES.forEach(function (scene) {
      var label = 'SCENE ' + scene.id;
      var objects = scene.objects || [];
      var frames = scene.frames || [];
      var positionedObjects = objects.length > 0 && objects.every(function (object) {
        return typeof object.x === 'number' && typeof object.y === 'number';
      });
      var presentableFrames = frames.length > 0 && frames.every(function (frame) {
        return !!(frame.narration || frame.textZh || frame.textEn || frame.emoji);
      });

      requireValue(!!scene.id, label + ': 缺少 id', errors);
      requireValue(VALID_LANGS.indexOf(scene.lang) >= 0, label + ': 非法 lang', errors);
      requireValue(['K1', 'K2'].indexOf(scene.grade) >= 0, label + ': 非法 grade', errors);
      requireValue(scene.anchors && Array.isArray(scene.anchors.curriculum) &&
        scene.anchors.curriculum.length > 0, label + ': 缺少 curriculum anchors', errors);
      requireValue(objects.length > 0, label + ': objects 为空', errors);
      requireValue(positionedObjects || presentableFrames,
        label + ': 既没有可定位 objects，也没有可呈现 frames', errors);
      requireValue(Array.isArray(scene.items) && scene.items.length > 0,
        label + ': items 为空', errors);

      var objectIds = objects.map(function (object) { return object.id; });
      var frameIds = frames.map(function (frame) { return frame.id; });
      var itemIds = (scene.items || []).map(function (item) { return item.id; });
      requireValue(unique(objectIds).length === objectIds.length, label + ': object ID 重复', errors);
      requireValue(unique(frameIds).length === frameIds.length, label + ': frame ID 重复', errors);
      requireValue(unique(itemIds).length === itemIds.length, label + ': item ID 重复', errors);
    });
  });

  renderCheck('Passage objective unit、level 与层级分布', function (errors) {
    LANG_DATA.PASSAGES.forEach(function (passage) {
      var label = passage.id;
      var items = passage.items || [];
      items.forEach(function (item) {
        var itemLabel = label + '/' + item.id;
        requireValue(VALID_UNITS.indexOf(item.unit) >= 0,
          itemLabel + ': 非法 unit ' + item.unit, errors);
        requireValue(VALID_LEVELS.indexOf(item.level) >= 0,
          itemLabel + ': 非法 level ' + item.level, errors);
        requireValue(!!item.template && !!item.interaction && !!item.prompt,
          itemLabel + ': 缺少 template/interaction/prompt', errors);

        if (item.interaction === 'hunt') {
          var huntChips = item.chips || [];
          var huntIds = huntChips.map(function (chip) { return chip.id; });
          var huntAnswer = item.answer || [];
          requireValue(huntChips.length > 0, itemLabel + ': hunt chips 为空', errors);
          requireValue(huntIds.every(Boolean) && unique(huntIds).length === huntIds.length,
            itemLabel + ': hunt chip ID 缺失或重复', errors);
          requireValue(huntAnswer.length > 0 && unique(huntAnswer).length === huntAnswer.length,
            itemLabel + ': hunt answer 为空或包含重复 ID', errors);
          huntAnswer.forEach(function (chipId) {
            requireValue(huntIds.indexOf(chipId) >= 0,
              itemLabel + ': hunt answer 引用了不存在的 chip ' + chipId, errors);
          });
        }

        if (item.interaction === 'match') {
          var pairs = item.pairs || [];
          var pairIds = pairs.map(function (pair) { return pair.id; });
          requireValue(pairs.length > 0, itemLabel + ': match pairs 为空', errors);
          requireValue(pairIds.every(Boolean) && unique(pairIds).length === pairIds.length,
            itemLabel + ': match pair ID 缺失或重复', errors);
          pairs.forEach(function (pair) {
            requireValue(!!pair.left && !!pair.right,
              itemLabel + '/' + (pair.id || '?') + ': match left/right 为空', errors);
          });
        }

        if (item.interaction === 'sort') {
          var groups = item.groups || [];
          var cards = item.cards || [];
          var groupIds = groups.map(function (group) { return group.id; });
          var cardIds = cards.map(function (card) { return card.id; });
          requireValue(groups.length >= 2, itemLabel + ': sort 至少需要两个 groups', errors);
          requireValue(cards.length > 0, itemLabel + ': sort cards 为空', errors);
          requireValue(groupIds.every(Boolean) && unique(groupIds).length === groupIds.length,
            itemLabel + ': sort group ID 缺失或重复', errors);
          requireValue(cardIds.every(Boolean) && unique(cardIds).length === cardIds.length,
            itemLabel + ': sort card ID 缺失或重复', errors);
          cards.forEach(function (card) {
            requireValue(groupIds.indexOf(card.groupId) >= 0,
              itemLabel + '/' + (card.id || '?') + ': 引用了不存在的 group ' + card.groupId, errors);
          });
          groupIds.forEach(function (groupId) {
            requireValue(cards.some(function (card) { return card.groupId === groupId; }),
              itemLabel + ': group ' + groupId + ' 没有 card', errors);
          });
        }

        if (item.interaction === 'build') {
          var slots = item.slots || [];
          var buildChips = item.chips || [];
          var slotIds = slots.map(function (slot) { return slot.id; });
          var buildChipIds = buildChips.map(function (chip) { return chip.id; });
          requireValue(slots.length > 0, itemLabel + ': build slots 为空', errors);
          requireValue(buildChips.length > 0, itemLabel + ': build chips 为空', errors);
          requireValue(slotIds.every(Boolean) && unique(slotIds).length === slotIds.length,
            itemLabel + ': build slot ID 缺失或重复', errors);
          requireValue(buildChipIds.every(Boolean) && unique(buildChipIds).length === buildChipIds.length,
            itemLabel + ': build chip ID 缺失或重复', errors);
          buildChips.forEach(function (chip) {
            requireValue(slotIds.indexOf(chip.slotId) >= 0,
              itemLabel + '/' + (chip.id || '?') + ': 引用了不存在的 slot ' + chip.slotId, errors);
          });
          slotIds.forEach(function (slotId) {
            requireValue(buildChips.filter(function (chip) {
              return chip.slotId === slotId;
            }).length === 1, itemLabel + ': slot ' + slotId + ' 必须恰有一个正确 chip', errors);
          });
        }
      });

      var l1Count = items.filter(function (item) { return item.level === 'L1'; }).length;
      var l2Plus = items.filter(function (item) {
        return ['L2', 'L3', 'L4'].indexOf(item.level) >= 0;
      }).length;
      requireValue(l1Count <= 1, label + ': L1 超过 1 道', errors);
      requireValue(items.length > 0 && l2Plus / items.length >= 0.7,
        label + ': L2+ 比例低于 70%', errors);
    });
  });

  renderCheck('Scene objective 合同', function (errors) {
    LANG_DATA.SCENES.forEach(function (scene) {
      (scene.items || []).forEach(function (item) {
        var label = scene.id + '/' + item.id;
        requireValue(VALID_UNITS.indexOf(item.unit) >= 0,
          label + ': 非法 unit ' + item.unit, errors);
        requireValue(['hotspot', 'order', 'select'].indexOf(item.interaction) >= 0,
          label + ': 非法 interaction ' + item.interaction, errors);

        if (item.interaction === 'hotspot') {
          requireValue(!!item.target && Array.isArray(item.distractors),
            label + ': hotspot 缺少 target/distractors', errors);
          requireValue(!!(item.prompt || item.promptZh || item.promptEn),
            label + ': hotspot 缺少 prompt', errors);
        }

        if (item.interaction === 'order') {
          requireValue(Array.isArray(scene.frames) && scene.frames.length > 0,
            label + ': order scene 缺少 frames', errors);
        }

        if (item.interaction === 'select') {
          requireValue(!!item.template,
            label + ': select 缺少 template', errors);
          requireValue(VALID_LEVELS.indexOf(item.level) >= 0,
            label + ': select 非法 level ' + item.level, errors);
          requireValue(!!(item.prompt || item.promptZh || item.promptEn),
            label + ': select 缺少 prompt', errors);
          requireValue(Array.isArray(item.options) && item.options.length > 0,
            label + ': select options 为空', errors);
          requireValue(Number.isInteger(item.answer) &&
            item.answer >= 0 && item.answer < (item.options || []).length,
            label + ': select answer index 非法', errors);
          (item.options || []).forEach(function (option, index) {
            if (index === item.answer) { return; }
            requireValue(!!option.errorType,
              label + ': 选项 ' + index + ' 缺少 errorType', errors);
          });
        }
      });
    });
  });

  renderCheck('Select 干扰项均带 errorType', function (errors) {
    LANG_DATA.PASSAGES.forEach(function (passage) {
      (passage.items || []).forEach(function (item) {
        if (item.interaction !== 'select') { return; }
        (item.options || []).forEach(function (option, index) {
          if (index === item.answer) { return; }
          requireValue(!!option.errorType,
            passage.id + '/' + item.id + ': 选项 ' + index + ' 缺少 errorType', errors);
        });
      });
    });
  });

  renderCheck('Evidence 与 Claim/Evidence 引用闭合', function (errors) {
    LANG_DATA.PASSAGES.forEach(function (passage) {
      var sentenceIds = (passage.sentences || []).map(function (sentence) { return sentence.id; });
      var byId = {};
      (passage.items || []).forEach(function (item) { byId[item.id] = item; });

      (passage.items || []).forEach(function (item) {
        var label = passage.id + '/' + item.id;
        if (item.interaction === 'evidence' && item.target === 'sentence') {
          requireValue(Array.isArray(item.answer) && item.answer.length > 0,
            label + ': sentence evidence answer 为空', errors);
          (item.answer || []).forEach(function (sentenceId) {
            requireValue(sentenceIds.indexOf(sentenceId) >= 0,
              label + ': 引用了不存在的 sentence ' + sentenceId, errors);
          });
        }

        if (item.evidenceFor || item.claimItemId) {
          var claimId = item.evidenceFor || item.claimItemId;
          var claim = byId[claimId];
          requireValue(!!claim, label + ': 找不到 claim ' + claimId, errors);
          if (claim) {
            requireValue(!!item.pairId && item.pairId === claim.pairId,
              label + ': pairId 与 claim 不闭合', errors);
            requireValue(item.claimItemId === claim.id && item.evidenceFor === claim.id,
              label + ': claimItemId/evidenceFor 未同时指向 claim', errors);
          }
        }

        if (item.pairId && !item.evidenceFor && !item.claimItemId) {
          var evidence = (passage.items || []).filter(function (candidate) {
            return candidate.pairId === item.pairId &&
              candidate.evidenceFor === item.id &&
              candidate.claimItemId === item.id;
          });
          requireValue(evidence.length > 0, label + ': claim 没有闭合 evidence', errors);
        }
      });
    });
  });

  renderCheck('Express / Create CCR 结构', function (errors) {
    LANG_DATA.PASSAGES.concat(LANG_DATA.SCENES).forEach(function (entry) {
      if (entry.expressCcr) { auditCcr(entry, entry.id + '/expressCcr', entry.expressCcr, errors); }
      if (entry.createCcr) { auditCcr(entry, entry.id + '/createCcr', entry.createCcr, errors); }
      if (entry.ccr) { auditCcr(entry, entry.id + '/ccr', entry.ccr, errors); }
    });
  });

  renderCheck('全部 authored Scene 精确生成', function (errors) {
    LANG_DATA.SCENES.forEach(function (scene) {
      var units = unique((scene.items || []).map(function (item) {
        return item.unit;
      }));

      units.forEach(function (unit) {
        var authored = (scene.items || []).filter(function (item) {
          return item.unit === unit;
        });
        var generated = LANG_GEN.generateSceneById(scene.id, unit, 31);
        var label = scene.id + '/' + unit;

        requireValue(generated.length === authored.length,
          label + ': generated/authored 数量不一致', errors);
        requireValue(sameArray(
          generated.map(function (question) { return question.itemId; }),
          authored.map(function (item) { return item.id; })
        ), label + ': generated/authored itemId 顺序不一致', errors);

        generated.forEach(function (question, index) {
          var item = authored[index];
          requireValue(question.seq === index,
            label + '/' + question.itemId + ': seq 不连续', errors);
          requireValue(question.primaryAbility === unit,
            label + '/' + question.itemId + ': primaryAbility 错误', errors);
          requireValue(question.unit === unit,
            label + '/' + question.itemId + ': unit 错误', errors);
          requireValue(question.geneId === LANG_GEN.UNIT_GENE[unit],
            label + '/' + question.itemId + ': geneId 错误', errors);
          if (item) {
            requireValue(question.template === (item.template || item.interaction),
              label + '/' + question.itemId + ': template 未保留', errors);
            requireValue(question.level === (item.level || null),
              label + '/' + question.itemId + ': level 未保留', errors);
          }
        });
      });
    });
  });

  renderCheck('全部 Ability Training scope 生成回归', function (errors) {
    VALID_LANGS.forEach(function (lang) {
      VALID_GRADES.forEach(function (grade) {
        VALID_UNITS.forEach(function (ability) {
          if (!LANG_GEN.hasContent(lang, grade, ability)) { return; }
          var questions = grade === 'K1' || grade === 'K2'
            ? LANG_GEN.generateScene(lang, grade, ability, 23)
            : LANG_GEN.generate(lang, grade, ability, 23);
          var label = lang + '/' + grade + '/' + ability;
          requireValue(questions.length > 0, label + ': 生成结果为空', errors);
          questions.forEach(function (question, index) {
            requireValue(question.seq === index, label + ': seq 不连续', errors);
            requireValue(question.primaryAbility === ability,
              label + '/' + question.itemId + ': primaryAbility 错误', errors);
            requireValue(question.unit === ability,
              label + '/' + question.itemId + ': unit 错误', errors);
            requireValue(question.geneId === LANG_GEN.UNIT_GENE[ability],
              label + '/' + question.itemId + ': geneId 错误', errors);
          });
        });
      });
    });
  });

  renderCheck('Works/Journey registry 合同', function (errors) {
    var expectedIds = [
      'zh-g1-goose-poem',
      'zh-g2-snipe-clam-adaptation',
      'en-g1-twinkle-rhyme',
      'en-g2-north-wind-sun'
    ];

    requireValue(sameArray(LANG_GEN.JOURNEY_PASSAGE_IDS, expectedIds),
      'Journey registry 与代表作品集合不一致', errors);
    requireValue(LANG_GEN.generateJourney('zh-g1-borrow-umbrella', 17).length === 0,
      '未登记 passage 生成了 Journey', errors);

    expectedIds.forEach(function (passageId) {
      var passage = LANG_GEN.passageById(passageId);
      var journey = LANG_GEN.generateJourney(passageId, 17);
      var journeyAgain = LANG_GEN.generateJourney(passageId, 17);
      var label = passageId;

      requireValue(!!passage, label + ': 找不到 passage', errors);
      requireValue(journey.length > 0, label + ': Journey 为空', errors);
      if (!passage || !journey.length) { return; }

      requireValue(journey.every(function (q) { return q.passageId === passageId; }),
        label + ': Journey 混入其他 passageId', errors);
      requireValue(journey.every(function (q, index) { return q.seq === index; }),
        label + ': seq 不连续', errors);
      requireValue(journey.every(function (q) { return q.primaryAbility === null; }),
        label + ': primaryAbility 不为 null', errors);
      requireValue(unique(journey.map(function (q) { return q.itemId; })).length === journey.length,
        label + ': itemId 不唯一', errors);
      requireValue(sameArray(
        journey.slice(0, passage.items.length).map(function (q) { return q.itemId; }),
        passage.items.map(function (item) { return item.id; })
      ), label + ': objective questions 未保持 authored order', errors);

      passage.items.forEach(function (item) {
        if (['hunt', 'match', 'sort', 'build'].indexOf(item.interaction) < 0) { return; }
        var question = journey.filter(function (q) { return q.itemId === item.id; })[0];
        var questionAgain = journeyAgain.filter(function (q) { return q.itemId === item.id; })[0];
        var itemLabel = label + '/' + item.id;

        requireValue(!!question && !!questionAgain,
          itemLabel + ': fixed-seed activity question 缺失', errors);
        if (!question || !questionAgain) { return; }

        requireValue(question.kind === item.interaction,
          itemLabel + ': generated kind 错误', errors);
        requireValue(question.itemId === item.id &&
          question.unit === item.unit &&
          question.geneId === LANG_GEN.UNIT_GENE[item.unit] &&
          question.template === item.template &&
          question.level === item.level,
          itemLabel + ': authored metadata 未完整保留', errors);
        requireValue(sameArray(question.options, ['check']) && question.answer === 'check',
          itemLabel + ': 未使用 Shell check-only 合同', errors);

        if (item.interaction === 'match') {
          var pairIds = item.pairs.map(function (pair) { return pair.id; });
          requireValue(sameArray(question.leftDeal, questionAgain.leftDeal),
            itemLabel + ': leftDeal 对 fixed seed 不稳定', errors);
          requireValue(sameArray(question.rightDeal, questionAgain.rightDeal),
            itemLabel + ': rightDeal 对 fixed seed 不稳定', errors);
          requireValue(question.leftDeal.length === pairIds.length &&
            sameSet(question.leftDeal, pairIds),
            itemLabel + ': leftDeal 不是完整 pair ID permutation', errors);
          requireValue(question.rightDeal.length === pairIds.length &&
            sameSet(question.rightDeal, pairIds),
            itemLabel + ': rightDeal 不是完整 pair ID permutation', errors);
        } else {
          var expectedDeal = item.interaction === 'sort'
            ? item.cards.map(function (card) { return card.id; })
            : item.chips.map(function (chip) { return chip.id; });
          requireValue(sameArray(question.deal, questionAgain.deal),
            itemLabel + ': deal 对 fixed seed 不稳定', errors);
          requireValue(question.deal.length === expectedDeal.length &&
            sameSet(question.deal, expectedDeal),
            itemLabel + ': deal 不是完整 stable-ID permutation', errors);
        }
      });

      var ccrUnits = journey.slice(passage.items.length).map(function (q) { return q.unit; });
      var firstCreate = ccrUnits.indexOf('create');
      requireValue(firstCreate > 0 &&
        ccrUnits.slice(0, firstCreate).every(function (unit) { return unit === 'express'; }) &&
        ccrUnits.slice(firstCreate).every(function (unit) { return unit === 'create'; }),
        label + ': CCR 顺序不是 Express 后 Create', errors);
      requireValue(journey.some(function (q) { return q.itemId === 'ccr-express-reflect'; }),
        label + ': 缺少独立 Express reflect ID', errors);
      requireValue(journey.some(function (q) { return q.itemId === 'ccr-create-reflect'; }),
        label + ': 缺少独立 Create reflect ID', errors);
      requireValue(unique(journey.map(function (q) { return q.geneId; })).length === 7,
        label + ': 未覆盖预期的 7 个 RootGene', errors);

      journey.forEach(function (question) {
        requireValue(question.geneId === LANG_GEN.UNIT_GENE[question.unit],
          label + '/' + question.itemId + ': unit/geneId 不匹配', errors);
      });
    });

    [
      ['zh-g1-goose-poem', 'q1', 'sort'],
      ['zh-g2-snipe-clam-adaptation', 'q5', 'match'],
      ['en-g1-twinkle-rhyme', 'q4', 'hunt'],
      ['en-g2-north-wind-sun', 'q4', 'build']
    ].forEach(function (expected) {
      var question = LANG_GEN.generateJourney(expected[0], 17).filter(function (q) {
        return q.itemId === expected[1];
      })[0];
      requireValue(!!question && question.kind === expected[2],
        expected[0] + '/' + expected[1] + ': 预期 kind 为 ' + expected[2], errors);
    });

    var goose = LANG_GEN.generateJourney('zh-g1-goose-poem', 17);
    var gooseClaim = goose.filter(function (q) {
      return q.itemId === 'q-infer-goose-picture';
    })[0];
    var gooseEvidence = goose.filter(function (q) {
      return q.itemId === 'q-infer-goose-picture-evidence';
    })[0];
    requireValue(!!gooseClaim && !!gooseEvidence, '《咏鹅》缺少 claim/evidence', errors);
    if (gooseClaim && gooseEvidence) {
      requireValue(gooseClaim.pairId === gooseEvidence.pairId,
        '《咏鹅》claim/evidence pairId 不一致', errors);
      requireValue(gooseEvidence.claimItemId === gooseClaim.itemId &&
        gooseEvidence.evidenceFor === gooseClaim.itemId,
        '《咏鹅》evidence 未闭合到 claim', errors);
      requireValue(sameArray(gooseEvidence.answer, ['s3', 's4']),
        '《咏鹅》evidence answer 不是精确的 s3+s4', errors);
      requireValue(sameArray(gooseEvidence.options, ['check']),
        '《咏鹅》多句 evidence 未使用单一 check option', errors);
      requireValue(sameSet(['s4', 's3'], gooseEvidence.answer),
        '《咏鹅》集合判定不应依赖选择顺序', errors);
      requireValue(!sameSet(['s3'], gooseEvidence.answer),
        '《咏鹅》集合判定错误接受缺句', errors);
      requireValue(!sameSet(['s3', 's4', 's1'], gooseEvidence.answer),
        '《咏鹅》集合判定错误接受多余句子', errors);
    }

    var twinkle = LANG_GEN.generateJourney('en-g1-twinkle-rhyme', 17);
    var twinkleEvidence = twinkle.filter(function (q) {
      return q.itemId === 'q-infer-twinkle-star-picture-evidence';
    })[0];
    requireValue(!!twinkleEvidence, 'Twinkle Journey 缺少多句 evidence', errors);
    if (twinkleEvidence) {
      requireValue(sameArray(twinkleEvidence.answer, ['s1', 's3', 's4']),
        'Twinkle evidence answer 不是精确的 s1+s3+s4', errors);
      requireValue(sameArray(twinkleEvidence.options, ['check']),
        'Twinkle 多句 evidence 未使用单一 check option', errors);
      requireValue(sameSet(['s4', 's1', 's3'], twinkleEvidence.answer),
        'Twinkle 集合判定不应依赖选择顺序', errors);
      requireValue(!sameSet(['s1', 's3'], twinkleEvidence.answer),
        'Twinkle 集合判定错误接受缺句', errors);
      requireValue(!sameSet(['s1', 's3', 's4', 's2'], twinkleEvidence.answer),
        'Twinkle 集合判定错误接受多余句子', errors);
    }
  });

  summary.textContent =
    'PASSAGES ' + LANG_DATA.PASSAGES.length +
    ' · SCENES ' + LANG_DATA.SCENES.length +
    ' · 自动检查 ' + (passed + failed) +
    ' · ' + (failed ? ('FAIL ' + failed) : ('全部 PASS (' + passed + ')'));
  summary.className = failed ? 'summary bad' : 'summary ok';
}());
</script>
</body>
</html>
