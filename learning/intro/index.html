<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>入门启航 | 智慧元中心</title>
  <style>
    :root {
      --bg: #f3f5f9;
      --card: #ffffff;
      --line: #e8edf5;
      --ink: #1f2a3a;
      --muted: #6f7f94;
      --blue: #2d77e8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }

    a { color: inherit; text-decoration: none; }

    .page {
      width: min(1460px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .topbar {
      position: relative;
      min-height: 126px;
      margin-bottom: 16px;
    }

    .back-btn {
      position: absolute;
      left: 0;
      top: 4px;
      min-width: 120px;
      height: 34px;
      border-radius: 8px;
      background: var(--blue);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(45, 119, 232, 0.25);
    }

    .hero {
      text-align: center;
      padding-top: 0;
    }

    .hero h1 {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 42px;
      font-weight: 900;
      color: #202b3a;
      margin-bottom: 8px;
    }

    .hero p {
      font-size: 35px;
      color: var(--muted);
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      min-height: 142px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card-link:hover {
      border-color: #b9d2ff;
      box-shadow: 0 6px 20px rgba(45, 119, 232, 0.08);
    }

    .head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .icon {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #1d2a3a;
      flex: 0 0 auto;
    }

    .i1 { background: #f3e7df; }
    .i2 { background: #8f1a27; color: #fff; }
    .i3 { background: #a5e68e; }
    .i4 { background: #4d9a3b; color: #fff; }
    .i5 { background: #f6f6e8; }
    .i6 { background: #596a4c; color: #fff; }

    .title {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.1;
    }

    .t1 { color: #1faa4b; }
    .t2 { color: #ff7b21; }
    .t3 { color: #6a40d2; }
    .t4 { color: #ff3e81; }
    .t5 { color: #1e9ec5; }
    .t6 { color: #f13f56; }

    .desc {
      font-size: 34px;
      color: #6f7f94;
      line-height: 1.28;
    }

    @media (max-width: 1280px) {
      .hero h1 { font-size: 34px; }
      .hero p { font-size: 25px; }
      .title { font-size: 30px; }
      .desc { font-size: 24px; }
    }

    @media (max-width: 920px) {
      .grid { grid-template-columns: 1fr; }
      .hero h1 { font-size: 30px; }
      .hero p { font-size: 21px; }
      .title { font-size: 26px; }
      .desc { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="back-btn" href="../index.html" id="btnBackCenter">返回智慧元中心</a>
      <div class="hero">
        <h1><span>🏁</span><span>入门启航</span></h1>
        <p>从好奇开始, 发现思考的乐趣</p>
      </div>
    </header>

    <section class="grid">
      <a class="card card-link" href="./observe.html">
        <div class="head"><span class="icon i1">👀</span><h2 class="title t1">1. 初步观察</h2></div>
        <p class="desc">观察国际象棋棋盘和棋子的基本构成</p>
      </a>

      <a class="card card-link" href="./board-basics.html">
        <div class="head"><span class="icon i2">♞</span><h2 class="title t2">2. 认识棋盘</h2></div>
        <p class="desc">学习国际象棋棋盘的结构和特点</p>
      </a>

      <a class="card card-link" href="./pieces-overview.html">
        <div class="head"><span class="icon i3">▦</span><h2 class="title t3">3. 认识棋子</h2></div>
        <p class="desc">认识国际象棋的各种棋子</p>
      </a>

      <a class="card card-link" href="./piece-moves.html">
        <div class="head"><span class="icon i4">🔄</span><h2 class="title t4">4. 棋子走法</h2></div>
        <p class="desc">详细学习每种棋子的走法规则</p>
      </a>

      <a class="card card-link" href="./demo-games.html">
        <div class="head"><span class="icon i5">🎭</span><h2 class="title t5">5. 棋局演示</h2></div>
        <p class="desc">本部分演示几个经典的国际象棋对局，对对弈有个初步认识</p>
      </a>

      <a class="card card-link" href="./review.html">
        <div class="head"><span class="icon i6">📊</span><h2 class="title t6">6. 总结与回顾</h2></div>
        <p class="desc">回顾学过的知识，巩固学习成果</p>
      </a>
    </section>
  </main>

  <script>
    (function () {
      var btn = document.getElementById("btnBackCenter");
      if (!btn) return;
      btn.addEventListener("click", function (e) {
        if (window.history.length > 1) {
          e.preventDefault();
          window.history.back();
        }
      });
    }());
  </script>
</body>
</html>
