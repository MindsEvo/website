<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2. 认识棋盘 | 入门启航</title>
  <style>
    :root {
      --page-bg: #f3f5f9;
      --card-bg: #ffffff;
      --line: #e6ebf3;
      --ink: #1a2433;
      --muted: #6f7f94;
      --blue: #3f74ae;
      --green: #2eb25b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--page-bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }

    .page {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 8px 4px 4px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .top-btn {
      min-width: 102px;
      height: 30px;
      border-radius: 6px;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-back { background: var(--blue); }
    .btn-tip { background: var(--green); }

    .layout {
      display: grid;
      grid-template-columns: 1.08fr 1.22fr;
      gap: 12px;
      min-height: calc(100vh - 52px);
    }

    .left,
    .right {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .left {
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .board-wrap {
      background: #6f8f4d;
      border: 1px solid #6f8f4d;
      padding: 10px;
      margin-top: 4px;
    }

    .board-shell {
      --board-size: min(78vw, 610px);
      width: calc(var(--board-size) + 24px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 24px var(--board-size);
      grid-template-rows: var(--board-size) 24px;
    }

    .board {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: var(--board-size);
      height: var(--board-size);
      border: 2px solid rgba(92, 111, 71, 0.9);
      position: relative;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
    }

    .piece-svg {
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
    }

    .piece-text {
      font-size: 88%;
      line-height: 1;
      color: #101827;
      pointer-events: none;
    }

    .piece-text-min {
      font-size: 74%;
      opacity: 0.95;
    }

    .files, .ranks {
      display: grid;
      color: #17212f;
      font-size: 14px;
      font-weight: 600;
    }

    .file-bottom { grid-template-columns: repeat(8, 1fr); grid-column: 2; grid-row: 2; }
    .rank-left { grid-template-rows: repeat(8, 1fr); grid-column: 1; grid-row: 1; }

    .files span,
    .ranks span {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coord-active {
      color: #b45309;
      font-weight: 900;
      text-shadow: 0 0 6px rgba(245, 158, 11, 0.5);
    }

    .control-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      padding: 8px 2px 4px;
    }

    .ctrl-btn {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      font-size: 12px;
      color: #1f2d40;
    }

    .ctrl-btn.active {
      background: #f9cb2d;
    }

    .meta {
      margin-left: 6px;
      font-size: 13px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .bar {
      width: 52px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff9800 0 68%, #d0d7e3 68% 100%);
    }

    .bar.speed {
      background: linear-gradient(90deg, #4f46e5 0 64%, #34d399 64% 100%);
    }

    .meta-box {
      min-width: 26px;
      height: 22px;
      border: 1px solid #d7deea;
      border-radius: 4px;
      background: #f8fafc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .right {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-card h2 {
      font-size: 34px;
      font-weight: 900;
    }

    .mode-actions {
      display: flex;
      gap: 6px;
    }

    .small-pill {
      min-width: 66px;
      height: 36px;
      border: 0;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-pill.blue { background: #1c76ea; }
    .small-pill.green { background: #16a34a; }

    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      flex: 1;
    }

    .group { margin-bottom: 18px; }
    .group:last-child { margin-bottom: 0; }

    .group h3 {
      font-size: 34px;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .chips {
      display: grid;
      gap: 7px;
    }

    .chips.rows-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    .chips.rows-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

    .chip {
      height: 34px;
      border-radius: 6px;
      border: 0;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
    }

    .c-green { background: #2cb34a; }
    .c-blue { background: #1d73e8; }
    .c-violet { background: #e400ee; }
    .c-indigo { background: #26439a; }
    .c-forest { background: #176a35; }
    .c-red { background: #d71f44; }
    .c-lime { background: #1f9e2a; }
    .c-orange { background: #ff6e00; }

    .observe-active {
      box-shadow: 0 0 0 2px #fef3c7, 0 0 0 4px #f59e0b;
    }

    .practice-current {
      box-shadow: 0 0 0 2px #2563eb, 0 0 0 4px #bfdbfe;
    }

    .practice-correct,
    .quiz-correct {
      box-shadow: 0 0 0 2px #16a34a, 0 0 0 4px #bbf7d0;
    }

    .practice-wrong,
    .quiz-wrong {
      box-shadow: 0 0 0 2px #dc2626, 0 0 0 4px #fecaca;
    }

    .quiz-current {
      box-shadow: 0 0 0 2px #0f766e, 0 0 0 4px #99f6e4;
    }

    .status-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d8e2f1;
      background: #f8fbff;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 8px;
    }

    .quiz-opt {
      height: 34px;
      border-radius: 6px;
      border: 0;
      background: #0f77e8;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .quiz-opt:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
    }

    .quiz-opt.correct {
      box-shadow: 0 0 0 2px #16a34a, 0 0 0 4px #bbf7d0;
      background: #22c55e;
    }

    .quiz-opt.wrong {
      box-shadow: 0 0 0 2px #dc2626, 0 0 0 4px #fecaca;
      background: #ef4444;
    }

    @keyframes observeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes practiceBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.24; }
    }

    @keyframes quizBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.28; }
    }

    .observe-blink { animation: observeBlink 0.65s ease-in-out infinite; }
    .practice-blink { animation: practiceBlink 0.58s ease-in-out infinite; }
    .quiz-blink { animation: quizBlink 0.62s ease-in-out infinite; }

    .hl-piece-white { filter: drop-shadow(0 0 4px rgba(59, 130, 246, 0.8)); }
    .hl-piece-black { filter: drop-shadow(0 0 4px rgba(248, 113, 113, 0.85)); }
    .hl-square-light { box-shadow: inset 0 0 0 4px rgba(56, 189, 248, 0.85); }
    .hl-square-dark { box-shadow: inset 0 0 0 4px rgba(168, 85, 247, 0.8); }
    .hl-border { box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.85) inset; }
    .hl-rank { box-shadow: inset 0 5px 0 rgba(37, 99, 235, 0.85), inset 0 -5px 0 rgba(37, 99, 235, 0.85); }
    .hl-file { box-shadow: inset 5px 0 0 rgba(22, 163, 74, 0.85), inset -5px 0 0 rgba(22, 163, 74, 0.85); }
    .hl-diag-dark { box-shadow: inset 0 0 0 4px rgba(220, 38, 38, 0.82); }
    .hl-diag-light { box-shadow: inset 0 0 0 4px rgba(34, 197, 94, 0.82); }

    .tips-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.26);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      padding: 16px;
    }

    .tips-modal.hidden { display: none; }

    .tips-dialog {
      width: min(520px, 96vw);
      min-height: 620px;
      background: #fff;
      border: 1px solid #d9e1ee;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.26);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .tips-head {
      padding: 14px 18px 8px;
      border-bottom: 1px solid #edf2f7;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tips-head h4 {
      font-size: 22px;
      font-weight: 900;
      color: #1f2d40;
    }

    .tips-close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: #f1f5f9;
      color: #334155;
      font-size: 20px;
      cursor: pointer;
    }

    .tips-body {
      padding: 16px 24px;
      color: #1f334f;
      font-size: 22px;
      line-height: 1.6;
    }

    .tips-body h5 {
      font-size: 28px;
      color: #0f2547;
      margin-bottom: 12px;
    }

    .tips-body ol {
      padding-left: 26px;
      display: grid;
      gap: 10px;
    }

    .tips-foot {
      padding: 10px 16px 16px;
      display: flex;
      justify-content: center;
    }

    .tips-ok {
      min-width: 120px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: #2eb25b;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr; min-height: auto; }
      .title-card h2 { font-size: 26px; }
      .group h3 { font-size: 24px; }
      .chips.rows-8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .chips.rows-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="top-btn btn-back" href="./index.html" id="btnBackIntro">返回入门启航</a>
      <button class="top-btn btn-tip" id="btnKeyTips" type="button">要点提示</button>
    </header>

    <section class="layout">
      <section class="left">
        <div class="board-wrap" id="boardWrap">
          <div class="board-shell">
            <div class="ranks rank-left" id="rankLeft"></div>
            <div class="board" id="board"></div>
            <div class="files file-bottom" id="fileBottom"></div>
          </div>
        </div>

        <div class="control-strip">
          <button class="ctrl-btn">↺</button>
          <button class="ctrl-btn">▶</button>
          <button class="ctrl-btn">↩</button>
          <button class="ctrl-btn">→</button>
          <button class="ctrl-btn">🔊</button>
          <button class="ctrl-btn">🎤</button>
          <button class="ctrl-btn active">👥</button>
          <button class="ctrl-btn">👤</button>
          <button class="ctrl-btn">🤖</button>
          <button class="ctrl-btn">◔</button>
          <span class="meta">音量:<span class="bar"></span><span class="meta-box">80</span></span>
          <span class="meta">速度:<span class="bar speed"></span><span class="meta-box">5</span></span>
        </div>
      </section>

      <section class="right">
        <div class="title-card">
          <h2>2. 认识棋盘</h2>
          <div class="mode-actions">
            <button class="small-pill blue" id="btnStudentVoice" type="button">致学生</button>
            <button class="small-pill green" id="btnParentVoice" type="button">致家长</button>
          </div>
        </div>

        <div class="panel">
          <div class="group">
            <h3>动态观察</h3>
            <div class="chips rows-8" id="observeButtons">
              <button class="chip c-green" data-observe="board-border">边界</button>
              <button class="chip c-blue" data-observe="light-squares">浅色格子</button>
              <button class="chip c-violet" data-observe="dark-squares">深色格子</button>
              <button class="chip c-indigo" data-observe="ranks">横格</button>
              <button class="chip c-forest" data-observe="files">竖格</button>
              <button class="chip c-red" data-observe="dark-diagonals">深斜格</button>
              <button class="chip c-lime" data-observe="light-diagonals">浅斜格</button>
              <button class="chip c-orange" data-observe="coordinates">坐标</button>
            </div>
          </div>

          <div class="group">
            <h3>操作练习</h3>
            <div class="chips rows-8" id="practiceButtons">
              <button class="chip c-green" data-practice="board-border">边界</button>
              <button class="chip c-blue" data-practice="light-squares">浅色格子</button>
              <button class="chip c-violet" data-practice="dark-squares">深色格子</button>
              <button class="chip c-indigo" data-practice="ranks">横格</button>
              <button class="chip c-forest" data-practice="files">竖格</button>
              <button class="chip c-red" data-practice="dark-diagonals">深斜格</button>
              <button class="chip c-lime" data-practice="light-diagonals">浅斜格</button>
              <button class="chip c-orange" data-practice="coordinates">坐标</button>
            </div>
            <div class="status-box" id="practiceStatus">操作练习：先点击上方一个选项按钮，再在棋盘上作答。</div>
          </div>

          <div class="group">
            <h3>问答练习</h3>
            <div class="chips rows-5" id="quizButtons">
              <button class="chip c-blue" data-quiz="left-bottom">左下坐标</button>
              <button class="chip c-blue" data-quiz="right-bottom">右下坐标</button>
              <button class="chip c-blue" data-quiz="left-top">左上坐标</button>
              <button class="chip c-blue" data-quiz="right-top">右上坐标</button>
              <button class="chip c-blue" data-quiz="diag-count">斜格计数</button>
            </div>
            <div class="status-box" id="quizStatus">问答练习：请选择上方一个问题开始作答。</div>
            <div class="quiz-options" id="quizOptions"></div>
          </div>
        </div>
      </section>
    </section>

    <div class="tips-modal hidden" id="tipsModal" aria-hidden="true">
      <div class="tips-dialog" role="dialog" aria-modal="true" aria-labelledby="tipsTitle">
        <div class="tips-head">
          <h4 id="tipsTitle">要点提示</h4>
          <button class="tips-close" type="button" id="btnTipsClose" aria-label="关闭">×</button>
        </div>
        <div class="tips-body">
          <h5>📌 本单元学习要点</h5>
          <ol>
            <li>观察棋盘边界、深浅格子的交替排列</li>
            <li>认识横格、竖格和斜格的方向特征</li>
            <li>熟悉棋盘四角坐标与基本定位方法</li>
            <li>通过操作和问答练习巩固棋盘结构认识</li>
          </ol>
        </div>
        <div class="tips-foot">
          <button class="tips-ok" type="button" id="btnTipsOk">我知道了</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var DISPLAY_SETTINGS_KEY = 'cognichess:display-settings';
      var PIECE_ASSET = {
        wk: 'wK.svg', wq: 'wQ.svg', wr: 'wR.svg', wb: 'wB.svg', wn: 'wN.svg', wp: 'wP.svg',
        bk: 'bK.svg', bq: 'bQ.svg', br: 'bR.svg', bb: 'bB.svg', bn: 'bN.svg', bp: 'bP.svg'
      };
      var PIECE_UNICODE = {
        wk: '♔', wq: '♕', wr: '♖', wb: '♗', wn: '♘', wp: '♙',
        bk: '♚', bq: '♛', br: '♜', bb: '♝', bn: '♞', bp: '♟'
      };
      var BOARD_THEMES = {
        classic: { light: '#f1f1cf', dark: '#769656' },
        ocean: { light: '#d9ecff', dark: '#4f7fb3' },
        wood: { light: '#f6e5c9', dark: '#b9855a' }
      };

      var current = { boardTheme: 'classic', pieceStyle: 'svg' };
      var boardMatrix = [
        ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
        ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
        ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
      ];

      var backBtn = document.getElementById('btnBackIntro');
      var boardEl = document.getElementById('board');
      var fileBottom = document.getElementById('fileBottom');
      var rankLeft = document.getElementById('rankLeft');
      var boardWrap = document.getElementById('boardWrap');

      var observeButtons = document.querySelectorAll('[data-observe]');
      var practiceButtons = document.querySelectorAll('[data-practice]');
      var quizButtons = document.querySelectorAll('[data-quiz]');
      var practiceStatus = document.getElementById('practiceStatus');
      var quizStatus = document.getElementById('quizStatus');
      var quizOptions = document.getElementById('quizOptions');

      var btnKeyTips = document.getElementById('btnKeyTips');
      var btnStudentVoice = document.getElementById('btnStudentVoice');
      var btnParentVoice = document.getElementById('btnParentVoice');
      var tipsModal = document.getElementById('tipsModal');
      var btnTipsClose = document.getElementById('btnTipsClose');
      var btnTipsOk = document.getElementById('btnTipsOk');

      var observeTimer = null;
      var practiceTimer = null;
      var quizTimer = null;

      var currentPracticeTarget = null;
      var currentPracticeButton = null;
      var practiceArmed = false;

      var currentQuizKey = null;

      var lessonVoices = {
        explanation: '让我们来认识熟悉一下棋盘',
        student: '致学生：让我们一起探索棋盘的秘密，发现这些有趣的区域',
        parent: '致家长：引导孩子了解棋盘的各个区域，增强空间概念'
      };

      var observeConfig = {
        'board-border': { voice: '请观察棋盘的边界，这是国际象棋棋盘的外框' },
        'light-squares': { voice: '请观察浅色格子，国际象棋棋盘由深浅交替的格子组成' },
        'dark-squares': { voice: '请观察深色格子，它们与浅色格子交替排列形成棋盘' },
        'ranks': { voice: '请观察横格，棋盘从下到上有8行横格，称为第1行到第8行' },
        'files': { voice: '请观察竖格，棋盘从左到右有8列竖格，称为a列到h列' },
        'dark-diagonals': { voice: '请观察深色对角线，深色象只在深色格上走，行走路线就是这些斜线' },
        'light-diagonals': { voice: '请观察浅色对角线，浅色象只在浅色格上走，行走路线就是这些斜线' },
        'coordinates': { voice: '现在来认识棋盘坐标，每个格子都有唯一的坐标名称' }
      };

      var practiceConfig = {
        'board-border': { prompt: '现在请你点击棋盘边界' },
        'light-squares': { prompt: '现在请你点击浅色格子区域' },
        'dark-squares': { prompt: '现在请你点击深色格子区域' },
        'ranks': { prompt: '现在请你点击一个横格上的任意位置' },
        'files': { prompt: '现在请你点击一个竖格上的任意位置' },
        'dark-diagonals': { prompt: '现在请你点击深色对角线上的任意格子' },
        'light-diagonals': { prompt: '现在请你点击浅色对角线上的任意格子' },
        'coordinates': { prompt: '现在请你点击任意格子并说出它的坐标' }
      };

      var quizBank = {
        'left-bottom': {
          ask: '棋盘左下角的坐标是？',
          options: ['a1', 'h1', 'a8'],
          correct: 'a1',
          explain: '棋盘左下角坐标是 a1。',
          highlight: { mode: 'coordinates', row: 7, col: 0 }
        },
        'right-bottom': {
          ask: '棋盘右下角的坐标是？',
          options: ['a1', 'h8', 'h1'],
          correct: 'h1',
          explain: '棋盘右下角坐标是 h1。',
          highlight: { mode: 'coordinates', row: 7, col: 7 }
        },
        'left-top': {
          ask: '棋盘左上角的坐标是？',
          options: ['h8', 'a8', 'a1'],
          correct: 'a8',
          explain: '棋盘左上角坐标是 a8。',
          highlight: { mode: 'coordinates', row: 0, col: 0 }
        },
        'right-top': {
          ask: '棋盘右上角的坐标是？',
          options: ['a8', 'h8', 'h1'],
          correct: 'h8',
          explain: '棋盘右上角坐标是 h8。',
          highlight: { mode: 'coordinates', row: 0, col: 7 }
        },
        'diag-count': {
          ask: '棋盘最长的对角线有多少格？',
          options: ['6格', '7格', '8格'],
          correct: '8格',
          explain: '棋盘最长对角线有 8 格。',
          highlight: { mode: 'main-diagonal' }
        }
      };

      if (backBtn) {
        backBtn.addEventListener('click', function (e) {
          if (window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
        });
      }

      function speak(text) {
        if (!window.speechSynthesis || !text) {
          return;
        }
        try {
          window.speechSynthesis.cancel();
          var ut = new SpeechSynthesisUtterance(text);
          ut.lang = 'zh-CN';
          ut.rate = 0.92;
          ut.pitch = 1;
          window.speechSynthesis.speak(ut);
        } catch {}
      }

      function loadDisplaySettings() {
        try {
          var raw = localStorage.getItem(DISPLAY_SETTINGS_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && parsed.boardTheme && parsed.pieceStyle) {
            current = parsed;
          }
        } catch {}
      }

      function renderCoords() {
        var files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        var ranks = [8, 7, 6, 5, 4, 3, 2, 1];
        fileBottom.innerHTML = files.map(function (f, i) { return '<span data-file="' + i + '">' + f + '</span>'; }).join('');
        rankLeft.innerHTML = ranks.map(function (r, i) { return '<span data-rank="' + i + '">' + r + '</span>'; }).join('');
      }

      function pieceNode(piece) {
        if (!piece) return '';
        var sideClass = piece.charAt(0) === 'w' ? 'white-piece' : 'black-piece';
        if (current.pieceStyle === 'svg') {
          return '<span class="piece-node ' + sideClass + '"><img class="piece-svg" alt="' + piece + '" src="../../chess/play/assets/pieces/' + PIECE_ASSET[piece] + '"></span>';
        }
        if (current.pieceStyle === 'unicode-min') {
          return '<span class="piece-node ' + sideClass + ' piece-text piece-text-min">' + PIECE_UNICODE[piece] + '</span>';
        }
        return '<span class="piece-node ' + sideClass + ' piece-text">' + PIECE_UNICODE[piece] + '</span>';
      }

      function renderBoard() {
        var theme = BOARD_THEMES[current.boardTheme] || BOARD_THEMES.classic;
        var html = '';
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var bg = ((r + c) % 2 === 0) ? theme.light : theme.dark;
            var cls = ((r + c) % 2 === 0) ? 'square square-light' : 'square square-dark';
            html += '<div class="' + cls + '" data-row="' + r + '" data-col="' + c + '" style="background:' + bg + '">' + pieceNode(boardMatrix[r][c]) + '</div>';
          }
        }
        boardEl.innerHTML = html;
      }

      function getSquare(r, c) {
        return boardEl.querySelector('.square[data-row="' + r + '"][data-col="' + c + '"]');
      }

      function collectDiagonalSquares(row, col) {
        var out = [];
        var d;
        for (d = -7; d <= 7; d++) {
          var r1 = row + d;
          var c1 = col + d;
          if (r1 >= 0 && r1 < 8 && c1 >= 0 && c1 < 8) {
            out.push([r1, c1]);
          }
        }
        for (d = -7; d <= 7; d++) {
          var r2 = row + d;
          var c2 = col - d;
          if (r2 >= 0 && r2 < 8 && c2 >= 0 && c2 < 8) {
            out.push([r2, c2]);
          }
        }
        return out;
      }

      function collectMainDiagonalSquares() {
        var out = [];
        for (var i = 0; i < 8; i++) {
          out.push([i, i]);
          out.push([i, 7 - i]);
        }
        return out;
      }

      function clearScope(scope) {
        var blinkClass = scope + '-blink';
        var timerRef = null;
        document.querySelectorAll('.' + blinkClass).forEach(function (el) {
          el.classList.remove(blinkClass, 'hl-piece-white', 'hl-piece-black', 'hl-square-light', 'hl-square-dark', 'hl-border', 'hl-rank', 'hl-file', 'hl-diag-dark', 'hl-diag-light', 'coord-active');
        });
        if (scope === 'observe' && observeTimer) {
          window.clearTimeout(observeTimer);
          observeTimer = null;
        }
        if (scope === 'practice' && practiceTimer) {
          window.clearTimeout(practiceTimer);
          practiceTimer = null;
        }
        if (scope === 'quiz' && quizTimer) {
          window.clearTimeout(quizTimer);
          quizTimer = null;
        }
      }

      function scheduleScopeStop(scope) {
        var fn = function () { clearScope(scope); };
        if (scope === 'observe') {
          if (observeTimer) window.clearTimeout(observeTimer);
          observeTimer = window.setTimeout(fn, 10000);
          return;
        }
        if (scope === 'practice') {
          if (practiceTimer) window.clearTimeout(practiceTimer);
          practiceTimer = window.setTimeout(fn, 10000);
          return;
        }
        if (scope === 'quiz') {
          if (quizTimer) window.clearTimeout(quizTimer);
          quizTimer = window.setTimeout(fn, 10000);
        }
      }

      function highlightMode(scope, mode, context) {
        clearScope(scope);
        var blinkClass = scope + '-blink';
        var i;

        if (mode === 'board-border') {
          boardWrap.classList.add(blinkClass, 'hl-border');
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'light-squares') {
          boardEl.querySelectorAll('.square.square-light').forEach(function (el) {
            el.classList.add(blinkClass, 'hl-square-light');
          });
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'dark-squares') {
          boardEl.querySelectorAll('.square.square-dark').forEach(function (el) {
            el.classList.add(blinkClass, 'hl-square-dark');
          });
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'ranks') {
          if (context && Number.isInteger(context.row)) {
            boardEl.querySelectorAll('.square[data-row="' + context.row + '"]').forEach(function (el) {
              el.classList.add(blinkClass, 'hl-rank');
            });
            var rankNode = rankLeft.querySelector('[data-rank="' + context.row + '"]');
            if (rankNode) rankNode.classList.add(blinkClass, 'coord-active');
          } else {
            boardEl.querySelectorAll('.square').forEach(function (el) {
              el.classList.add(blinkClass, 'hl-rank');
            });
          }
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'files') {
          if (context && Number.isInteger(context.col)) {
            boardEl.querySelectorAll('.square[data-col="' + context.col + '"]').forEach(function (el) {
              el.classList.add(blinkClass, 'hl-file');
            });
            var fileNode = fileBottom.querySelector('[data-file="' + context.col + '"]');
            if (fileNode) fileNode.classList.add(blinkClass, 'coord-active');
          } else {
            boardEl.querySelectorAll('.square').forEach(function (el) {
              el.classList.add(blinkClass, 'hl-file');
            });
          }
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'dark-diagonals' || mode === 'light-diagonals') {
          var coords = [];
          if (context && Number.isInteger(context.row) && Number.isInteger(context.col)) {
            coords = collectDiagonalSquares(context.row, context.col);
          } else {
            boardEl.querySelectorAll(mode === 'dark-diagonals' ? '.square.square-dark' : '.square.square-light').forEach(function (el) {
              coords.push([Number(el.dataset.row), Number(el.dataset.col)]);
            });
          }
          coords.forEach(function (rc) {
            var sq = getSquare(rc[0], rc[1]);
            if (sq) {
              sq.classList.add(blinkClass, mode === 'dark-diagonals' ? 'hl-diag-dark' : 'hl-diag-light');
            }
          });
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'coordinates') {
          var row = context && Number.isInteger(context.row) ? context.row : null;
          var col = context && Number.isInteger(context.col) ? context.col : null;
          if (row === null || col === null) {
            for (i = 0; i < 8; i++) {
              var f = fileBottom.querySelector('[data-file="' + i + '"]');
              var r = rankLeft.querySelector('[data-rank="' + i + '"]');
              if (f) f.classList.add(blinkClass, 'coord-active');
              if (r) r.classList.add(blinkClass, 'coord-active');
            }
          } else {
            var sq = getSquare(row, col);
            if (sq) sq.classList.add(blinkClass, 'hl-square-light');
            var f2 = fileBottom.querySelector('[data-file="' + col + '"]');
            var r2 = rankLeft.querySelector('[data-rank="' + row + '"]');
            if (f2) f2.classList.add(blinkClass, 'coord-active');
            if (r2) r2.classList.add(blinkClass, 'coord-active');
          }
          scheduleScopeStop(scope);
          return;
        }

        if (mode === 'main-diagonal') {
          collectMainDiagonalSquares().forEach(function (rc) {
            var sq2 = getSquare(rc[0], rc[1]);
            if (sq2) sq2.classList.add(blinkClass, 'hl-diag-dark');
          });
          scheduleScopeStop(scope);
          return;
        }
      }

      function runObserve(action) {
        observeButtons.forEach(function (btn) { btn.classList.remove('observe-active'); });
        var button = document.querySelector('[data-observe="' + action + '"]');
        if (button) button.classList.add('observe-active');
        highlightMode('observe', action);
        if (observeConfig[action] && observeConfig[action].voice) {
          speak(observeConfig[action].voice);
        }
      }

      function armPractice(target, btn) {
        if (!practiceConfig[target]) {
          return;
        }
        practiceButtons.forEach(function (b) {
          b.classList.remove('practice-current', 'practice-correct', 'practice-wrong');
        });
        currentPracticeTarget = target;
        currentPracticeButton = btn;
        practiceArmed = true;
        if (btn) btn.classList.add('practice-current');
        if (practiceStatus) {
          practiceStatus.textContent = '操作练习：' + practiceConfig[target].prompt;
        }
        speak(practiceConfig[target].prompt);
      }

      function getCoordName(row, col) {
        var files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        return files[col] + String(8 - row);
      }

      function checkPracticeBySquare(square) {
        if (!practiceArmed || !currentPracticeTarget || !square) {
          return;
        }
        var row = Number(square.dataset.row);
        var col = Number(square.dataset.col);
        var isLight = square.classList.contains('square-light');
        var isDark = square.classList.contains('square-dark');

        var ok = false;
        var target = currentPracticeTarget;
        if (target === 'light-squares') ok = isLight;
        else if (target === 'dark-squares') ok = isDark;
        else if (target === 'ranks') ok = true;
        else if (target === 'files') ok = true;
        else if (target === 'dark-diagonals') ok = isDark;
        else if (target === 'light-diagonals') ok = isLight;
        else if (target === 'coordinates') ok = true;
        else if (target === 'board-border') ok = false;

        practiceButtons.forEach(function (b) { b.classList.remove('practice-correct', 'practice-wrong', 'practice-current'); });
        if (currentPracticeButton) {
          currentPracticeButton.classList.add(ok ? 'practice-correct' : 'practice-wrong');
        }

        if (ok) {
          if (target === 'coordinates') {
            highlightMode('practice', 'coordinates', { row: row, col: col });
            if (practiceStatus) {
              practiceStatus.textContent = '✅ 回答正确：你点击了坐标 ' + getCoordName(row, col);
            }
            speak('回答正确。你点击了坐标 ' + getCoordName(row, col));
          } else {
            highlightMode('practice', target, { row: row, col: col });
            if (practiceStatus) {
              practiceStatus.textContent = '✅ 回答正确：' + currentPracticeButton.textContent;
            }
            speak('回答正确');
          }
          practiceArmed = false;
          return;
        }

        highlightMode('practice', target, { row: row, col: col });
        if (practiceStatus) {
          practiceStatus.textContent = '❌ 回答错误：' + practiceConfig[target].prompt;
        }
        speak('回答错误，请再试一次');
      }

      function checkPracticeBorderClick(isBorderArea) {
        if (!practiceArmed || currentPracticeTarget !== 'board-border') {
          return;
        }
        practiceButtons.forEach(function (b) { b.classList.remove('practice-correct', 'practice-wrong', 'practice-current'); });
        if (currentPracticeButton) {
          currentPracticeButton.classList.add(isBorderArea ? 'practice-correct' : 'practice-wrong');
        }
        if (isBorderArea) {
          highlightMode('practice', 'board-border');
          if (practiceStatus) {
            practiceStatus.textContent = '✅ 回答正确：边界';
          }
          speak('回答正确');
          practiceArmed = false;
          return;
        }
        if (practiceStatus) {
          practiceStatus.textContent = '❌ 回答错误：现在请你点击棋盘边界';
        }
        speak('回答错误，请再试一次');
      }

      function clearQuizButtonState() {
        quizButtons.forEach(function (btn) {
          btn.classList.remove('quiz-current', 'quiz-correct', 'quiz-wrong');
        });
      }

      function renderQuizOptions(key) {
        var q = quizBank[key];
        if (!q || !quizOptions) {
          quizOptions.innerHTML = '';
          return;
        }
        quizOptions.innerHTML = q.options.map(function (opt) {
          return '<button class="quiz-opt" data-quiz-opt="' + opt + '">' + opt + '</button>';
        }).join('');
      }

      function startQuiz(btn) {
        var key = btn.getAttribute('data-quiz');
        var q = quizBank[key];
        if (!q) {
          return;
        }
        clearQuizButtonState();
        clearScope('quiz');
        currentQuizKey = key;
        btn.classList.add('quiz-current');
        if (quizStatus) {
          quizStatus.textContent = '问题：' + q.ask;
        }
        renderQuizOptions(key);
        speak(q.ask);
      }

      function answerQuiz(optionText) {
        var q = quizBank[currentQuizKey];
        if (!q || !quizOptions) {
          return;
        }
        var chosen = String(optionText || '');
        var isCorrect = chosen === q.correct;
        var optionNodes = quizOptions.querySelectorAll('[data-quiz-opt]');
        optionNodes.forEach(function (node) {
          var text = node.getAttribute('data-quiz-opt');
          node.classList.remove('correct', 'wrong');
          if (text === chosen) node.classList.add(isCorrect ? 'correct' : 'wrong');
          if (!isCorrect && text === q.correct) node.classList.add('correct');
        });

        var activeBtn = null;
        quizButtons.forEach(function (btn) {
          if (btn.getAttribute('data-quiz') === currentQuizKey) {
            activeBtn = btn;
          }
          btn.classList.remove('quiz-correct', 'quiz-wrong');
        });
        if (activeBtn) activeBtn.classList.add(isCorrect ? 'quiz-correct' : 'quiz-wrong');

        if (quizStatus) {
          quizStatus.textContent = (isCorrect ? '✅ 回答正确：' : '❌ 回答错误：') + q.explain;
        }
        highlightMode('quiz', q.highlight.mode, q.highlight);
        speak((isCorrect ? '回答正确。' : '回答错误。') + q.explain);
      }

      function closeTipsModal() {
        if (!tipsModal) return;
        if (tipsModal.contains(document.activeElement) && document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
        tipsModal.classList.add('hidden');
        tipsModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      if (btnKeyTips) {
        btnKeyTips.addEventListener('click', function () {
          if (!tipsModal) return;
          tipsModal.classList.remove('hidden');
          tipsModal.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        });
      }
      if (btnTipsClose) btnTipsClose.addEventListener('click', closeTipsModal);
      if (btnTipsOk) btnTipsOk.addEventListener('click', closeTipsModal);
      if (tipsModal) {
        tipsModal.addEventListener('click', function (e) {
          if (e.target === tipsModal) closeTipsModal();
        });
      }

      if (btnStudentVoice) btnStudentVoice.addEventListener('click', function () { speak(lessonVoices.student); });
      if (btnParentVoice) btnParentVoice.addEventListener('click', function () { speak(lessonVoices.parent); });

      if (!boardEl || !fileBottom || !rankLeft) return;

      loadDisplaySettings();
      renderCoords();
      renderBoard();

      observeButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          var action = btn.getAttribute('data-observe');
          runObserve(action);
        });
      });

      practiceButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          armPractice(btn.getAttribute('data-practice'), btn);
        });
      });

      boardEl.addEventListener('click', function (e) {
        var sq = e.target.closest('.square');
        if (!sq) return;
        checkPracticeBySquare(sq);
      });

      if (boardWrap) {
        boardWrap.addEventListener('click', function (e) {
          if (!practiceArmed) return;
          var inBoard = !!e.target.closest('.board');
          if (currentPracticeTarget === 'board-border') {
            checkPracticeBorderClick(!inBoard);
          }
        });
      }

      quizButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          startQuiz(btn);
        });
      });

      if (quizOptions) {
        quizOptions.addEventListener('click', function (e) {
          var optBtn = e.target.closest('[data-quiz-opt]');
          if (!optBtn || !currentQuizKey) return;
          answerQuiz(optBtn.getAttribute('data-quiz-opt'));
        });
      }
    }());
  </script>
</body>
</html>
