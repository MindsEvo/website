<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1. 初步观察 | 入门启航</title>
  <style>
    :root { --bg:#f3f5f9; --card:#fff; --line:#e8edf5; --ink:#1f2a3a; --muted:#6f7f94; --blue:#2d77e8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; }
    .page { width:min(1180px,100%); margin:0 auto; padding:20px; }
    .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .back { min-width:126px; height:34px; border-radius:8px; background:var(--blue); color:#fff; font-size:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
    h1 { font-size:28px; margin-bottom:8px; }
    .sub { color:var(--muted); font-size:16px; margin-bottom:18px; }
    .block { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; }
    .block h2 { font-size:18px; margin-bottom:6px; }
    .block p { color:#5f6f85; font-size:15px; line-height:1.6; }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <a class="back" href="./index.html" id="btnBackIntro">返回入门启航</a>
    </div>
    <section class="card">
      <h1>1. 初步观察</h1>
      <p class="sub">观察国际象棋棋盘和棋子的基本构成</p>
      <div class="block"><h2>学习目标</h2><p>认识棋盘由 8x8 方格构成，了解黑白格交替与横纵坐标结构。</p></div>
      <div class="block"><h2>观察任务</h2><p>找出四个角格、中心格和兵线起始行，建立空间感知。</p></div>
    </section>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('btnBackIntro');
      if (btn) {
        btn.addEventListener('click', function (e) {
          if (window.history.length > 1) { e.preventDefault(); window.history.back(); }
        });
      }
    }());
  </script>
</body>
</html>
