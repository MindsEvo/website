<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>4. 棋子走法 | 入门启航</title>
  <style>
    :root {
      --page-bg: #f3f5f9;
      --card-bg: #ffffff;
      --line: #e6ebf3;
      --ink: #1a2433;
      --blue: #3f74ae;
      --green: #2eb25b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--page-bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }

    .page {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 8px 4px 4px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .top-btn {
      min-width: 102px;
      height: 30px;
      border-radius: 6px;
      border: none;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-back { background: var(--blue); }
    .btn-tip { background: var(--green); }

    .layout {
      display: grid;
      grid-template-columns: 1.08fr 1.22fr;
      gap: 12px;
      min-height: calc(100vh - 52px);
    }

    .left,
    .right {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: 10px;
    }

    .left {
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .board-wrap {
      background: #6f8f4d;
      border: 1px solid #6f8f4d;
      padding: 10px;
      margin-top: 4px;
    }

    .board-shell {
      --board-size: min(78vw, 610px);
      width: calc(var(--board-size) + 24px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 24px var(--board-size);
      grid-template-rows: var(--board-size) 24px;
    }

    .board {
      grid-column: 2;
      grid-row: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      width: var(--board-size);
      height: var(--board-size);
      border: 2px solid rgba(92, 111, 71, 0.9);
      position: relative;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      user-select: none;
      position: relative;
    }

    .piece-svg {
      width: 88%;
      height: 88%;
      object-fit: contain;
      pointer-events: none;
    }

    .piece-text {
      font-size: 88%;
      line-height: 1;
      color: #101827;
      pointer-events: none;
    }

    .piece-text-min {
      font-size: 74%;
      opacity: 0.95;
    }

    .files, .ranks {
      display: grid;
      color: #17212f;
      font-size: 14px;
      font-weight: 600;
    }

    .file-bottom { grid-template-columns: repeat(8, 1fr); grid-column: 2; grid-row: 2; }
    .rank-left { grid-template-rows: repeat(8, 1fr); grid-column: 1; grid-row: 1; }

    .files span,
    .ranks span {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .control-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      padding: 8px 2px 4px;
    }

    .ctrl-btn {
      width: 26px;
      height: 26px;
      border-radius: 4px;
      border: 1px solid #d7deea;
      background: #fff;
      font-size: 12px;
      color: #1f2d40;
    }

    .ctrl-btn.active { background: #f9cb2d; }

    .meta {
      margin-left: 6px;
      font-size: 13px;
      color: #334155;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .bar {
      width: 52px;
      height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, #ff9800 0 68%, #d0d7e3 68% 100%);
    }

    .bar.speed {
      background: linear-gradient(90deg, #4f46e5 0 64%, #34d399 64% 100%);
    }

    .meta-box {
      min-width: 26px;
      height: 22px;
      border: 1px solid #d7deea;
      border-radius: 4px;
      background: #f8fafc;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .right {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .title-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .title-card h2 {
      font-size: 34px;
      font-weight: 900;
    }

    .mode-actions {
      display: flex;
      gap: 6px;
    }

    .small-pill {
      min-width: 66px;
      height: 36px;
      border: 0;
      border-radius: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .small-pill.blue { background: #1c76ea; }
    .small-pill.green { background: #16a34a; }

    .panel {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      flex: 1;
    }

    .group { margin-bottom: 18px; }
    .group:last-child { margin-bottom: 0; }

    .group h3 {
      font-size: 34px;
      margin-bottom: 10px;
      font-weight: 900;
    }

    .chips {
      display: grid;
      gap: 7px;
    }

    .chips.rows-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .chips.rows-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }

    .chip {
      height: 34px;
      border-radius: 6px;
      border: 0;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .chip:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
    }

    .c-king { background: #ff6f0f; }
    .c-queen { background: #8b5cf6; }
    .c-rook { background: #ff2f6d; }
    .c-bishop { background: #2b4797; }
    .c-knight { background: #1e6f3d; }
    .c-pawn { background: #ff9800; }
    .c-blue { background: #1d73e8; }

    .observe-active {
      box-shadow: 0 0 0 2px #fef3c7, 0 0 0 4px #f59e0b;
    }

    .practice-current,
    .quiz-current {
      box-shadow: 0 0 0 2px #2563eb, 0 0 0 4px #bfdbfe;
    }

    .practice-correct,
    .quiz-correct {
      box-shadow: 0 0 0 2px #16a34a, 0 0 0 4px #bbf7d0;
    }

    .practice-wrong,
    .quiz-wrong {
      box-shadow: 0 0 0 2px #dc2626, 0 0 0 4px #fecaca;
    }

    .status-box {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #d8e2f1;
      background: #f8fbff;
      color: #334155;
      font-size: 13px;
      font-weight: 600;
    }

    .sub-menu {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
    }

    .sub-menu button {
      height: 32px;
      border: 1px solid #d6deec;
      border-radius: 6px;
      background: #f8fbff;
      color: #1f2d40;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .sub-menu button:hover {
      border-color: #3b82f6;
      color: #1d4ed8;
    }

    .quiz-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 8px;
    }

    .quiz-opt {
      height: 34px;
      border-radius: 6px;
      border: 0;
      background: #0f77e8;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .quiz-opt:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
    }

    .quiz-opt.correct {
      box-shadow: 0 0 0 2px #16a34a, 0 0 0 4px #bbf7d0;
      background: #22c55e;
    }

    .quiz-opt.wrong {
      box-shadow: 0 0 0 2px #dc2626, 0 0 0 4px #fecaca;
      background: #ef4444;
    }

    @keyframes observeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @keyframes practiceBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.24; }
    }

    @keyframes quizBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.28; }
    }

    .observe-blink { animation: observeBlink 0.65s ease-in-out infinite; }
    .practice-blink { animation: practiceBlink 0.58s ease-in-out infinite; }
    .quiz-blink { animation: quizBlink 0.62s ease-in-out infinite; }

    .hl-origin {
      box-shadow: inset 0 0 0 4px rgba(245, 158, 11, 0.95);
    }

    .hl-target {
      box-shadow: inset 0 0 0 4px rgba(30, 64, 175, 0.88);
    }

    .hl-piece {
      filter: drop-shadow(0 0 6px rgba(30, 64, 175, 0.85));
    }

    .tips-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.26);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1200;
      padding: 16px;
    }

    .tips-modal.hidden { display: none; }

    .tips-dialog {
      width: min(520px, 96vw);
      min-height: 620px;
      background: #fff;
      border: 1px solid #d9e1ee;
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.26);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .tips-head {
      padding: 14px 18px 8px;
      border-bottom: 1px solid #edf2f7;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tips-head h4 {
      font-size: 22px;
      font-weight: 900;
      color: #1f2d40;
    }

    .tips-close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 6px;
      background: #f1f5f9;
      color: #334155;
      font-size: 20px;
      cursor: pointer;
    }

    .tips-body {
      padding: 16px 24px;
      color: #1f334f;
      font-size: 22px;
      line-height: 1.6;
    }

    .tips-body h5 {
      font-size: 28px;
      color: #0f2547;
      margin-bottom: 12px;
    }

    .tips-body ol {
      padding-left: 26px;
      display: grid;
      gap: 10px;
    }

    .tips-foot {
      padding: 10px 16px 16px;
      display: flex;
      justify-content: center;
    }

    .tips-ok {
      min-width: 120px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      background: #2eb25b;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 1200px) {
      .layout { grid-template-columns: 1fr; min-height: auto; }
      .title-card h2 { font-size: 26px; }
      .group h3 { font-size: 24px; }
      .chips.rows-8 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .sub-menu { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="top-btn btn-back" href="./index.html" id="btnBackIntro">返回入门启航</a>
      <button class="top-btn btn-tip" id="btnKeyTips" type="button">要点提示</button>
    </header>

    <section class="layout">
      <section class="left">
        <div class="board-wrap" id="boardWrap">
          <div class="board-shell">
            <div class="ranks rank-left" id="rankLeft"></div>
            <div class="board" id="board"></div>
            <div class="files file-bottom" id="fileBottom"></div>
          </div>
        </div>
        <div class="control-strip">
          <button class="ctrl-btn">↺</button><button class="ctrl-btn">▶</button><button class="ctrl-btn">↩</button><button class="ctrl-btn">→</button>
          <button class="ctrl-btn">🔊</button><button class="ctrl-btn">🎤</button><button class="ctrl-btn active">👥</button><button class="ctrl-btn">👤</button>
          <button class="ctrl-btn">🤖</button><button class="ctrl-btn">◔</button>
          <span class="meta">音量:<span class="bar"></span><span class="meta-box">80</span></span>
          <span class="meta">速度:<span class="bar speed"></span><span class="meta-box">5</span></span>
        </div>
      </section>

      <section class="right">
        <div class="title-card">
          <h2>4. 棋子走法</h2>
          <div class="mode-actions">
            <button class="small-pill blue" id="btnStudentVoice" type="button">致学生</button>
            <button class="small-pill green" id="btnParentVoice" type="button">致家长</button>
          </div>
        </div>

        <div class="panel">
          <div class="group">
            <h3>动态观察</h3>
            <div class="chips rows-6" id="observeButtons">
              <button class="chip c-king" data-observe-piece="k">王 ▼</button>
              <button class="chip c-queen" data-observe-piece="q">后 ▼</button>
              <button class="chip c-rook" data-observe-piece="r">车 ▼</button>
              <button class="chip c-bishop" data-observe-piece="b">象 ▼</button>
              <button class="chip c-knight" data-observe-piece="n">马 ▼</button>
              <button class="chip c-pawn" data-observe-piece="p">兵 ▼</button>
            </div>
          </div>

          <div class="group">
            <h3>操作练习</h3>
            <div class="chips rows-6" id="practiceButtons">
              <button class="chip c-king" data-practice-piece="k">王 ▼</button>
              <button class="chip c-queen" data-practice-piece="q">后 ▼</button>
              <button class="chip c-rook" data-practice-piece="r">车 ▼</button>
              <button class="chip c-bishop" data-practice-piece="b">象 ▼</button>
              <button class="chip c-knight" data-practice-piece="n">马 ▼</button>
              <button class="chip c-pawn" data-practice-piece="p">兵 ▼</button>
            </div>
            <div class="status-box" id="practiceStatus">点击上方棋子按钮开始练习</div>
          </div>

          <div class="group">
            <h3>问答练习</h3>
            <div class="chips rows-8" id="quizTopicButtons">
              <button class="chip c-blue" data-quiz-topic="王">王 ▼</button>
              <button class="chip c-blue" data-quiz-topic="后">后 ▼</button>
              <button class="chip c-blue" data-quiz-topic="车">车 ▼</button>
              <button class="chip c-blue" data-quiz-topic="象">象 ▼</button>
              <button class="chip c-blue" data-quiz-topic="马">马 ▼</button>
              <button class="chip c-blue" data-quiz-topic="兵">兵 ▼</button>
              <button class="chip c-blue" data-quiz-topic="特殊规则">特殊规则 ▼</button>
              <button class="chip c-blue" data-quiz-topic="和棋">和棋 ▼</button>
            </div>
            <div class="sub-menu" id="quizSubMenu"></div>
            <div class="status-box" id="quizStatus">问答练习：先点击上方分类，再选择具体问题。</div>
            <div class="quiz-options" id="quizOptions"></div>
          </div>
        </div>
      </section>
    </section>

    <div class="tips-modal hidden" id="tipsModal" aria-hidden="true">
      <div class="tips-dialog" role="dialog" aria-modal="true" aria-labelledby="tipsTitle">
        <div class="tips-head">
          <h4 id="tipsTitle">要点提示</h4>
          <button class="tips-close" type="button" id="btnTipsClose" aria-label="关闭">×</button>
        </div>
        <div class="tips-body">
          <h5>📌 本单元学习要点</h5>
          <ol>
            <li>掌握王、后、车、象、马、兵的基础走法</li>
            <li>通过动态观察理解每种棋子的移动规律</li>
            <li>通过操作练习强化棋子识别和选取</li>
            <li>完成问答练习巩固特殊规则与和棋概念</li>
          </ol>
        </div>
        <div class="tips-foot">
          <button class="tips-ok" type="button" id="btnTipsOk">我知道了</button>
        </div>
      </div>
    </div>
  </main>

  <script>

        ],
        '马': [
          { menu: '走法', text: '马的走法是？', options: ['斜线任意格', '先走2格再转1格（L形）', '直线任意格'], answer: 1, voice: '马的走法是？' },
          { menu: '跳子', text: '马和其他棋子最大的区别是？', options: ['只走一格', '只能向前走', '可以跳过其他棋子'], answer: 2, voice: '马和其他棋子最大的区别是？' },
          { menu: '最优位置', text: '马在哪个位置控制格子最多？', options: ['角落', '边线', '中心区域'], answer: 2, voice: '马在哪个位置控制格子最多？' }
        ],
        '兵': [
          { menu: '吃子', text: '兵怎么吃子？', options: ['向前直吃', '向前斜一格', '向后斜一格'], answer: 1, voice: '兵怎么吃子？' },
          { menu: '升变', text: '兵到达对方底线后？', options: ['留在原地', '自动变成后', '可以升变为后、车、象或马'], answer: 2, voice: '兵到达对方底线后？' },
          { menu: '起步', text: '兵的第一步最多可以走几格？', options: ['只能走1格', '一格或两格', '三格'], answer: 1, voice: '兵的第一步最多可以走几格？' }
        ],
        '特殊规则': [
          { menu: '易位条件', text: '王车易位需要满足什么条件？', options: ['任何时候都可以', '王和车均未移动，中间无子，王未被将军', '只要王没移动过'], answer: 1, voice: '王车易位需要满足什么条件？' },
          { menu: '短易位落点', text: '白方短易位后，王落在哪个格子？', options: ['f1', 'g1', 'h1'], answer: 1, voice: '白方短易位后，王落在哪个格子？' },
          { menu: '过路兵条件', text: '吃过路兵在什么情况下可以发生？', options: ['任何时候', '对方兵走两格经过我兵旁边时', '对方兵升变时'], answer: 1, voice: '吃过路兵在什么情况下可以发生？' },
          { menu: '过路兵时限', text: '吃过路兵的机会有多久？', options: ['随时都可以', '只有对方走完双步后的下一步', '三步之内'], answer: 1, voice: '吃过路兵的机会有多久？' },
          { menu: '长易位落点', text: '白方长易位后，王落在哪个格子？', options: ['b1', 'c1', 'd1'], answer: 1, voice: '白方长易位后，王落在哪个格子？' }
        ],
        '和棋': [
          { menu: '和棋类型一', text: '以下哪两种情况都属于和棋？', options: ['将死和子力不足', '困毙和子力不足', '将军和困毙'], answer: 1, voice: '哪两种情况属于和棋？' },
          { menu: '和棋类型二', text: '以下哪种规则也能导致和棋？', options: ['一方连续将军10次', '同一局面重复出现3次，或连续50回合无吃子无动兵，或双方协商', '一方棋子比对方少'], answer: 1, voice: '还有哪些规则可以导致和棋？' },
          { menu: '困毙定义', text: '什么是困毙（Stalemate）？', options: ['被将死', '轮到某方走棋，无路可走且未被将军', '双方同意和棋'], answer: 1, voice: '什么是困毙？' },
          { menu: '子力不足', text: '双方只剩两个王时结果是？', options: ['先走方赢', '和棋（子力不足）', '继续对局直到有人犯错'], answer: 1, voice: '双方只剩两个王时结果是？' },
          { menu: '五十步规则', text: '五十步规则要求连续50回合满足什么条件才能申请和棋（只是作为基本常识顺便提一下）？', options: ['双方各走了50步', '连续50步没有兵被移动且没有任何棋子被吃掉', '一方连续将军50次'], answer: 1, voice: '五十步规则是什么？' }
        ]
      };

      var backBtn = document.getElementById('btnBackIntro');
      var boardEl = document.getElementById('board');
      var fileBottom = document.getElementById('fileBottom');
      var rankLeft = document.getElementById('rankLeft');
      var boardWrap = document.getElementById('boardWrap');

      var observeButtons = document.querySelectorAll('[data-observe-piece]');
      var practiceButtons = document.querySelectorAll('[data-practice-piece]');
      var quizTopicButtons = document.querySelectorAll('[data-quiz-topic]');
      var quizSubMenu = document.getElementById('quizSubMenu');
      var practiceStatus = document.getElementById('practiceStatus');
      var quizStatus = document.getElementById('quizStatus');
      var quizOptions = document.getElementById('quizOptions');

      var btnKeyTips = document.getElementById('btnKeyTips');
      var btnStudentVoice = document.getElementById('btnStudentVoice');
      var btnParentVoice = document.getElementById('btnParentVoice');
      var tipsModal = document.getElementById('tipsModal');
      var btnTipsClose = document.getElementById('btnTipsClose');
      var btnTipsOk = document.getElementById('btnTipsOk');

      var observeTimer = null;
      var practiceTimer = null;
      var quizTimer = null;

      var currentPracticePiece = null;
      var currentPracticeBtn = null;
      var practiceArmed = false;

      var currentQuizTopic = null;
      var currentQuizIndex = null;

      function speak(text) {
        if (!window.speechSynthesis || !text) return;
        try {
          window.speechSynthesis.cancel();
          var ut = new SpeechSynthesisUtterance(text);
          ut.lang = 'zh-CN';
          ut.rate = 0.92;
          ut.pitch = 1;
          window.speechSynthesis.speak(ut);
        } catch {}
      }

      function loadDisplaySettings() {
        try {
          var raw = localStorage.getItem(DISPLAY_SETTINGS_KEY);
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && parsed.boardTheme && parsed.pieceStyle) {
            current = parsed;
          }
        } catch {}
      }

      function renderCoords() {
        var files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        var ranks = [8, 7, 6, 5, 4, 3, 2, 1];
        fileBottom.innerHTML = files.map(function (f) { return '<span>' + f + '</span>'; }).join('');
        rankLeft.innerHTML = ranks.map(function (r) { return '<span>' + r + '</span>'; }).join('');
      }

      function pieceNode(piece) {
        if (!piece) return '';
        var kindClass = 'kind-' + piece.charAt(1);
        if (current.pieceStyle === 'svg') {
          return '<span class="piece-node ' + kindClass + '"><img class="piece-svg" alt="' + piece + '" src="../../chess/play/assets/pieces/' + PIECE_ASSET[piece] + '"></span>';
        }
        if (current.pieceStyle === 'unicode-min') {
          return '<span class="piece-node ' + kindClass + ' piece-text piece-text-min">' + PIECE_UNICODE[piece] + '</span>';
        }
        return '<span class="piece-node ' + kindClass + ' piece-text">' + PIECE_UNICODE[piece] + '</span>';
      }

      function renderBoard() {
        var theme = BOARD_THEMES[current.boardTheme] || BOARD_THEMES.classic;
        var html = '';
        for (var r = 0; r < 8; r++) {
          for (var c = 0; c < 8; c++) {
            var bg = ((r + c) % 2 === 0) ? theme.light : theme.dark;
            var cls = ((r + c) % 2 === 0) ? 'square square-light' : 'square square-dark';
            html += '<div class="' + cls + '" data-row="' + r + '" data-col="' + c + '" style="background:' + bg + '">' + pieceNode(boardMatrix[r][c]) + '</div>';
          }
        }
        boardEl.innerHTML = html;
      }

      function clearScope(scope) {
        var blinkClass = scope + '-blink';
        document.querySelectorAll('.' + blinkClass).forEach(function (el) {
          el.classList.remove(blinkClass, 'hl-origin', 'hl-target', 'hl-piece');
        });
        if (scope === 'observe' && observeTimer) {
          window.clearTimeout(observeTimer);
          observeTimer = null;
        }
        if (scope === 'practice' && practiceTimer) {
          window.clearTimeout(practiceTimer);
          practiceTimer = null;
        }
        if (scope === 'quiz' && quizTimer) {
          window.clearTimeout(quizTimer);
          quizTimer = null;
        }
      }

      function scheduleStop(scope) {
        var fn = function () { clearScope(scope); };
        if (scope === 'observe') {
          if (observeTimer) window.clearTimeout(observeTimer);
          observeTimer = window.setTimeout(fn, 10000);
          return;
        }
        if (scope === 'practice') {
          if (practiceTimer) window.clearTimeout(practiceTimer);
          practiceTimer = window.setTimeout(fn, 10000);
          return;
        }
        if (scope === 'quiz') {
          if (quizTimer) window.clearTimeout(quizTimer);
          quizTimer = window.setTimeout(fn, 10000);
        }
      }

      function getSquare(row, col) {
        return boardEl.querySelector('.square[data-row="' + row + '"][data-col="' + col + '"]');
      }

      function kingMoves() {
        return [[4,4],[3,3],[3,4],[3,5],[4,3],[4,5],[5,3],[5,4],[5,5]];
      }

      function rookMoves() {
        var arr = [[4,4]], i;
        for (i = 0; i < 8; i++) { if (i !== 4) arr.push([4, i]); }
        for (i = 0; i < 8; i++) { if (i !== 4) arr.push([i, 4]); }
        return arr;
      }

      function bishopMoves() {
        var arr = [[4,4]], d;
        for (d = 1; d < 8; d++) {
          if (4 + d < 8 && 4 + d < 8) arr.push([4 + d, 4 + d]);
          if (4 + d < 8 && 4 - d >= 0) arr.push([4 + d, 4 - d]);
          if (4 - d >= 0 && 4 + d < 8) arr.push([4 - d, 4 + d]);
          if (4 - d >= 0 && 4 - d >= 0) arr.push([4 - d, 4 - d]);
        }
        return arr;
      }

      function queenMoves() {
        return rookMoves().concat(bishopMoves());
      }

      function knightMoves() {
        return [[4,4],[2,3],[2,5],[3,2],[3,6],[5,2],[5,6],[6,3],[6,5]];
      }

      function pawnMoves() {
        return [[6,4],[5,4],[4,4],[5,3],[5,5]];
      }

      function movePattern(kind) {
        if (kind === 'k') return kingMoves();
        if (kind === 'q') return queenMoves();
        if (kind === 'r') return rookMoves();
        if (kind === 'b') return bishopMoves();
        if (kind === 'n') return knightMoves();
        return pawnMoves();
      }

      function observeVoice(kind) {
        if (kind === 'k') return '王可以向任意方向移动一格。';
        if (kind === 'q') return '后可以沿横线、竖线、斜线移动任意格。';
        if (kind === 'r') return '车可以沿横线和竖线移动任意格。';
        if (kind === 'b') return '象可以沿斜线移动任意格。';
        if (kind === 'n') return '马按日字移动，可以跳过其他棋子。';
        return '兵通常向前移动，吃子时斜向前一格。';
      }

      function highlightMoves(scope, kind) {
        clearScope(scope);
        var blinkClass = scope + '-blink';
        var pattern = movePattern(kind);
        for (var i = 0; i < pattern.length; i++) {
          var sq = getSquare(pattern[i][0], pattern[i][1]);
          if (!sq) continue;
          if (i === 0) sq.classList.add(blinkClass, 'hl-origin');
          else sq.classList.add(blinkClass, 'hl-target');
        }
        document.querySelectorAll('.piece-node.kind-' + kind).forEach(function (el) {
          el.classList.add(blinkClass, 'hl-piece');
        });
        scheduleStop(scope);
      }

      function runObserve(kind) {
        observeButtons.forEach(function (btn) { btn.classList.remove('observe-active'); });
        var btn = document.querySelector('[data-observe-piece="' + kind + '"]');
        if (btn) btn.classList.add('observe-active');
        highlightMoves('observe', kind);
        speak(observeVoice(kind));
      }

      function armPractice(btn) {
        var kind = btn.getAttribute('data-practice-piece');
        if (!kind) return;
        practiceButtons.forEach(function (b) { b.classList.remove('practice-current', 'practice-correct', 'practice-wrong'); });
        currentPracticePiece = kind;
        currentPracticeBtn = btn;
        practiceArmed = true;
        btn.classList.add('practice-current');

        var labels = {k:'王', q:'后', r:'车', b:'象', n:'马', p:'兵'};
        var text = '现在请你点击棋盘上的' + labels[kind];
        if (practiceStatus) practiceStatus.textContent = text;
        speak(text);
      }

      function checkPractice(square) {
        if (!practiceArmed || !currentPracticePiece || !square) return;
        var node = square.querySelector('.piece-node');
        var ok = !!(node && node.classList.contains('kind-' + currentPracticePiece));

        practiceButtons.forEach(function (b) { b.classList.remove('practice-current', 'practice-correct', 'practice-wrong'); });
        if (currentPracticeBtn) currentPracticeBtn.classList.add(ok ? 'practice-correct' : 'practice-wrong');

        highlightMoves('practice', currentPracticePiece);

        if (ok) {
          if (practiceStatus) practiceStatus.textContent = '✅ 回答正确';
          speak('回答正确');
          practiceArmed = false;
        } else {
          if (practiceStatus) practiceStatus.textContent = '❌ 回答错误，请再试一次';
          speak('回答错误，请再试一次');
        }
      }

      function clearQuizButtonState() {
        quizTopicButtons.forEach(function (btn) {
          btn.classList.remove('quiz-current', 'quiz-correct', 'quiz-wrong');
        });
      }

      function renderSubMenu(topic) {
        if (!quizSubMenu) return;
        var arr = quizGroups[topic] || [];
        quizSubMenu.innerHTML = arr.map(function (q, idx) {
          return '<button type="button" data-sub-topic="' + topic + '" data-sub-index="' + idx + '">' + q.menu + '</button>';
        }).join('');
      }

      function renderQuizOptions(topic, idx) {
        if (!quizOptions) return;
        var q = (quizGroups[topic] || [])[idx];
        if (!q) {
          quizOptions.innerHTML = '';
          return;
        }
        quizOptions.innerHTML = q.options.map(function (opt) {
          return '<button class="quiz-opt" data-quiz-opt="' + opt + '">' + opt + '</button>';
        }).join('');
      }

      function startQuizTopic(btn) {
        var topic = btn.getAttribute('data-quiz-topic');
        if (!quizGroups[topic]) return;
        clearQuizButtonState();
        btn.classList.add('quiz-current');
        currentQuizTopic = topic;
        currentQuizIndex = null;
        renderSubMenu(topic);
        if (quizStatus) quizStatus.textContent = '问答练习：请选择“' + topic + '”下的具体问题。';
        if (quizOptions) quizOptions.innerHTML = '';
      }

      function startQuizQuestion(topic, idx) {
        var q = (quizGroups[topic] || [])[idx];
        if (!q) return;
        currentQuizTopic = topic;
        currentQuizIndex = idx;
        if (quizStatus) quizStatus.textContent = '问题：' + q.text;
        renderQuizOptions(topic, idx);
        speak(q.voice);
      }

      function answerQuiz(optionText) {
        var q = (quizGroups[currentQuizTopic] || [])[currentQuizIndex];
        if (!q || !quizOptions) return;
        var chosen = String(optionText || '');
        var correctText = q.options[q.answer];
        var isCorrect = chosen === correctText;

        quizOptions.querySelectorAll('[data-quiz-opt]').forEach(function (node) {
          var t = node.getAttribute('data-quiz-opt');
          node.classList.remove('correct', 'wrong');
          if (t === chosen) node.classList.add(isCorrect ? 'correct' : 'wrong');
          if (!isCorrect && t === correctText) node.classList.add('correct');
        });

        quizTopicButtons.forEach(function (btn) {
          if (btn.getAttribute('data-quiz-topic') === currentQuizTopic) {
            btn.classList.remove('quiz-correct', 'quiz-wrong');
            btn.classList.add(isCorrect ? 'quiz-correct' : 'quiz-wrong');
          }
        });

        if (quizStatus) {
          quizStatus.textContent = (isCorrect ? '✅ 回答正确：' : '❌ 回答错误：') + q.text;
        }
        speak(isCorrect ? '回答正确' : '回答错误');
      }

      function closeTipsModal() {
        if (!tipsModal) return;
        if (tipsModal.contains(document.activeElement) && document.activeElement && document.activeElement.blur) {
          document.activeElement.blur();
        }
        tipsModal.classList.add('hidden');
        tipsModal.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
      }

      if (btnKeyTips) {
        btnKeyTips.addEventListener('click', function () {
          if (!tipsModal) return;
          tipsModal.classList.remove('hidden');
          tipsModal.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        });
      }

      if (btnTipsClose) btnTipsClose.addEventListener('click', closeTipsModal);
      if (btnTipsOk) btnTipsOk.addEventListener('click', closeTipsModal);
      if (tipsModal) {
        tipsModal.addEventListener('click', function (e) {
          if (e.target === tipsModal) closeTipsModal();
        });
      }

      if (btnStudentVoice) btnStudentVoice.addEventListener('click', function () { speak(lessonVoices.student); });
      if (btnParentVoice) btnParentVoice.addEventListener('click', function () { speak(lessonVoices.parent); });

      if (backBtn) {
        backBtn.addEventListener('click', function (e) {
          if (window.history.length > 1) {
            e.preventDefault();
            window.history.back();
          }
        });
      }

      if (!boardEl || !fileBottom || !rankLeft) return;

      loadDisplaySettings();
      renderCoords();
      renderBoard();

      observeButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          runObserve(btn.getAttribute('data-observe-piece'));
        });
      });

      practiceButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          armPractice(btn);
        });
      });

      boardEl.addEventListener('click', function (e) {
        var sq = e.target.closest('.square');
        if (!sq) return;
        checkPractice(sq);
      });

      quizTopicButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          startQuizTopic(btn);
        });
      });

      if (quizSubMenu) {
        quizSubMenu.addEventListener('click', function (e) {
          var b = e.target.closest('[data-sub-index]');
          if (!b) return;
          startQuizQuestion(b.getAttribute('data-sub-topic'), Number(b.getAttribute('data-sub-index')));
        });
      }

      if (quizOptions) {
        quizOptions.addEventListener('click', function (e) {
          var b = e.target.closest('[data-quiz-opt]');
          if (!b || currentQuizTopic === null || currentQuizIndex === null) return;
          answerQuiz(b.getAttribute('data-quiz-opt'));
        });
      }
    }());
  </script>
</body>
