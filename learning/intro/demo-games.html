<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5. 棋局演示 | 入门启航</title>
  <style>
    :root { --bg:#f3f5f9; --card:#fff; --line:#e8edf5; --ink:#1f2a3a; --muted:#6f7f94; --blue:#2d77e8; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--bg); color:var(--ink); font-family:"Microsoft YaHei","PingFang SC","Helvetica Neue",Arial,sans-serif; }
    .page { width:min(1180px,100%); margin:0 auto; padding:20px; }
    .top { margin-bottom:16px; }
    .back { min-width:126px; height:34px; border-radius:8px; background:var(--blue); color:#fff; font-size:14px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px; }
    h1 { font-size:28px; margin-bottom:8px; }
    .sub { color:var(--muted); font-size:16px; margin-bottom:14px; }
    .tip { background:#f8fbff; border:1px dashed #c8d9f6; border-radius:10px; padding:14px; color:#4f647f; font-size:15px; line-height:1.7; }
  </style>
</head>
<body>
  <main class="page">
    <div class="top"><a class="back" href="./index.html" id="btnBackIntro">返回入门启航</a></div>
    <section class="card">
      <h1>5. 棋局演示</h1>
      <p class="sub">本部分演示几个经典的国际象棋对局，对对弈有个初步认识</p>
      <div class="tip">将接入示例对局播放、关键步讲解和局面提示。当前为页面骨架，便于后续接数据与交互。</div>
    </section>
  </main>
  <script>(function(){var b=document.getElementById('btnBackIntro');if(b){b.addEventListener('click',function(e){if(window.history.length>1){e.preventDefault();window.history.back();}});}}());</script>
</body>
</html>
